<style>
:root{--ink:#29251f;--muted:#81796f;--gold:#a9864d;--gold2:#d7bd8d;--cream:#f7f3ec;--paper:#fffdf9;--line:#e9e1d5;--green:#55745f;--red:#a75e54;--shadow:0 14px 40px #4a38200d}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif}button,input,select{font:inherit}button{cursor:pointer}.serif{font-family:"Playfair Display",serif}.app{min-height:100vh}.topbar{height:76px;padding:0 clamp(18px,5vw,64px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fffdf9eF;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:38px;height:38px;border:1px solid var(--gold2);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-family:Georgia;font-size:21px}.brand-name{font-family:"Playfair Display",serif;font-size:22px;letter-spacing:3px}.brand-sub{font-size:9px;color:var(--muted);letter-spacing:1.8px;text-transform:uppercase}.top-actions{display:flex;gap:10px;align-items:center}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:11px 16px;border-radius:7px;font-weight:600;font-size:13px}.btn:hover{border-color:var(--gold)}.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}.btn.gold{background:var(--gold);color:white;border-color:var(--gold)}.btn.ghost{background:transparent}.layout{display:grid;grid-template-columns:230px 1fr;max-width:1440px;margin:auto;min-height:calc(100vh - 76px)}.sidebar{padding:30px 18px;border-right:1px solid var(--line);background:#fbf8f2}.side-label{font-size:10px;letter-spacing:1.6px;color:#a59b8e;text-transform:uppercase;padding:0 12px;margin:12px 0}.nav{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;padding:12px;border-radius:7px;color:#6f685e;text-align:left;margin:3px 0;font-size:13px}.nav.active,.nav:hover{background:#efe7da;color:var(--ink)}.nav .ico{width:20px;text-align:center;color:var(--gold)}.main{padding:clamp(22px,4vw,54px);min-width:0}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700}.page-title{font:500 clamp(29px,4vw,42px) "Playfair Display",serif;margin:8px 0}.sub{color:var(--muted);font-size:14px;line-height:1.7}.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:28px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:26px 0}.stat,.panel,.wedding-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}.stat{padding:20px}.stat-label{font-size:12px;color:var(--muted)}.stat-num{font:500 32px "Playfair Display",serif;margin-top:8px}.panel{padding:22px;margin:18px 0}.panel h3{font:500 21px "Playfair Display",serif;margin:0 0 6px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.wedding-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.wedding-card{overflow:hidden}.card-cover{height:115px;background:linear-gradient(120deg,#e9dfce,#f8f2e8 60%,#d9c7a8);display:flex;align-items:center;justify-content:center;color:#a9864d;font:italic 28px "Playfair Display",serif}.wedding-body{padding:18px}.wedding-body h3{font:500 23px "Playfair Display",serif;margin:0 0 6px}.meta{font-size:12px;color:var(--muted);margin:5px 0 14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:#8d8377;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:12px 10px;border-bottom:1px solid var(--line)}td{padding:13px 10px;border-bottom:1px solid #f0ebe3}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:#f1eadf;color:#796341;font-size:10px;font-weight:700}.pill.ok{background:#eaf1eb;color:var(--green)}.pill.no{background:#f7eae7;color:var(--red)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:11px;color:#766e63;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:6px;background:#fffdf9;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--gold)}.full{grid-column:1/-1}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;font-size:13px}.hidden{display:none!important}.modal-back{position:fixed;inset:0;background:#201b16a6;z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:12px;padding:26px;box-shadow:0 25px 80px #0003}.modal h2{font:500 28px "Playfair Display",serif;margin:0 0 20px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.notice{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px}.invite-page{min-height:100vh;background:#f2ece2;padding:26px 14px;display:grid;place-items:center}.invite-card{width:min(760px,100%);background:#fffdf9;border:1px solid #dfd2bd;padding:clamp(28px,7vw,68px);text-align:center;position:relative;box-shadow:0 20px 80px #4a382014}.invite-card:before{content:"";position:absolute;inset:12px;border:1px solid #e8dcc9;pointer-events:none}.invite-kicker{letter-spacing:3px;text-transform:uppercase;font-size:10px;color:var(--gold)}.invite-title{font:400 clamp(36px,7vw,62px) "Playfair Display",serif;line-height:1.1;margin:24px 0 12px}.amp{font:italic 30px "Playfair Display",serif;color:var(--gold)}.invite-copy{max-width:510px;margin:22px auto;color:#71685d;line-height:1.9;font-size:14px}.invite-rule{width:70px;height:1px;background:var(--gold2);margin:24px auto}.invite-details{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;margin:28px 0}.detail strong{display:block;font:500 20px "Playfair Display",serif;margin-bottom:4px}.detail span{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#968a7a}.guest-box{margin:26px auto 0;padding:18px;border:1px solid var(--line);max-width:420px}.guest-box strong{font:500 22px "Playfair Display",serif}.qr{display:flex;justify-content:center;margin:15px auto}.lang{font-size:12px;border:1px solid var(--line);background:white;padding:8px 10px;border-radius:6px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#29251f;color:white;padding:12px 18px;border-radius:8px;font-size:12px;z-index:50}.small{font-size:11px;color:var(--muted)}.check-row{display:flex;align-items:center;gap:8px}.check-row input{width:auto}.footer{font-size:10px;color:#a39a8d;text-align:center;margin:30px 0 10px}.photo-preview{width:100%;max-width:260px;max-height:220px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;margin-top:10px}.editor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field textarea{width:100%;min-height:105px;padding:12px;border:1px solid var(--line);border-radius:6px;background:#fffdf9;color:var(--ink);font:inherit;resize:vertical}.field textarea:focus{outline:1px solid var(--gold)}.section-note{font-size:12px;color:var(--muted);line-height:1.6}.invite-photo{width:min(100%,520px);max-height:360px;object-fit:cover;margin:20px auto 4px;border-radius:3px}.invite-extra{margin:25px auto;max-width:540px;text-align:left;padding:18px;border-top:1px solid var(--line)}.invite-extra h3{font:500 21px "Playfair Display",serif;margin:0 0 10px}.invite-extra p{font-size:13px;line-height:1.8;color:#71685d;white-space:pre-line}.invite-extra a{color:var(--gold);font-weight:700}.music-player{margin:20px auto;max-width:420px}.music-player audio{width:100%}

@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);gap:4px}.side-label{display:none}.nav{white-space:nowrap;width:auto;padding:10px}.nav .ico{width:auto}.main{padding:22px 16px}.cards{grid-template-columns:1fr 1fr}.wedding-grid{grid-template-columns:1fr}.head-row{align-items:flex-start;flex-direction:column}.topbar{height:66px}.brand-name{font-size:19px}}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px}.stat-num{font-size:26px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.top-actions .btn{padding:9px 10px}.brand-sub{display:none}.invite-details{gap:18px}}

<body>

<script>
const $=s=>document.querySelector(s);
const storeKey='nuptia_demo_v1';
const translations={
fr:{overview:'Vue d’ensemble',weddings:'Mariages',guests:'Invités',seating:'Placement',checkin:'Accueil & QR',settings:'Paramètres',welcome:'Votre espace de gestion',hello:'Organisez chaque union avec élégance.',newWedding:'Créer un mariage',active:'Mariages créés',guestsCount:'Invités enregistrés',checked:'Invités accueillis',yourWeddings:'Vos espaces de mariage',open:'Gérer',view:'Voir invitation',datePending:'Date à définir',adminNote:'Prototype de démonstration : les données sont enregistrées sur cet appareil uniquement.',createTitle:'Créer un espace de mariage',couple:'Noms du couple',date:'Date du mariage',venue:'Lieu principal',save:'Enregistrer',cancel:'Annuler',guestTitle:'Liste des invités',addGuest:'Ajouter un invité',guestName:'Nom de l’invité',email:'Téléphone (facultatif)',seats:'Places autorisées',table:'Table attribuée',status:'Statut',invite:'Invitation',pending:'En attente',confirmed:'Confirmé',declined:'Décliné',notAssigned:'Non attribuée',assign:'Attribuer',search:'Rechercher un invité…',seatingTitle:'Plan de placement',tableName:'Nom / numéro de table',capacity:'Capacité',addTable:'Ajouter une table',tableGuests:'Invités placés',checkTitle:'Contrôle des entrées',checkHint:'Recherchez un invité pour valider son arrivée.',mark:'Valider l’entrée',arrived:'Arrivé',notArrived:'Pas encore arrivé',public:'Invitation publique',back:'Retour au tableau de bord',rsvp:'Confirmer ma présence',map:'Obtenir l’itinéraire',welcomeText:'C’est avec une immense joie que nous vous invitons à partager avec nous ce moment précieux de notre histoire.',invited:'Vous êtes cordialement invités',places:'Places réservées',yourTable:'Votre table',scan:'Code d’invitation',notFound:'Invitation introuvable',language:'Langue',dateLabel:'Date',placeLabel:'Lieu',noGuests:'Aucun invité pour le moment.',noTables:'Aucune table créée.',copy:'Copier le lien',share:'Partager WhatsApp',delete:'Supprimer',edit:'Modifier',saveChanges:'Enregistrer les changements',rsvpDone:'Merci pour votre réponse !',demo:'Données de démonstration'}
,en:{overview:'Overview',weddings:'Weddings',guests:'Guests',seating:'Seating',checkin:'Check-in & QR',settings:'Settings',welcome:'Your management space',hello:'Organize every union with elegance.',newWedding:'Create a wedding',active:'Weddings created',guestsCount:'Registered guests',checked:'Guests checked in',yourWeddings:'Your wedding spaces',open:'Manage',view:'View invitation',datePending:'Date to be confirmed',adminNote:'Demo prototype: data is stored on this device only.',createTitle:'Create a wedding space',couple:'Couple’s names',date:'Wedding date',venue:'Main venue',save:'Save',cancel:'Cancel',guestTitle:'Guest list',addGuest:'Add a guest',guestName:'Guest name',email:'Phone (optional)',seats:'Allowed seats',table:'Assigned table',status:'Status',invite:'Invitation',pending:'Pending',confirmed:'Confirmed',declined:'Declined',notAssigned:'Not assigned',assign:'Assign',search:'Search for a guest…',seatingTitle:'Seating plan',tableName:'Table name / number',capacity:'Capacity',addTable:'Add a table',tableGuests:'Guests seated',checkTitle:'Guest check-in',checkHint:'Search for a guest to confirm arrival.',mark:'Check in',arrived:'Arrived',notArrived:'Not checked in',public:'Public invitation',back:'Back to dashboard',rsvp:'Confirm attendance',map:'Get directions',welcomeText:'We are delighted to invite you to share this precious moment in our story.',invited:'You are warmly invited',places:'Reserved seats',yourTable:'Your table',scan:'Invitation code',notFound:'Invitation not found',language:'Language',dateLabel:'Date',placeLabel:'Venue',noGuests:'No guests yet.',noTables:'No tables created.',copy:'Copy link',share:'Share on WhatsApp',delete:'Delete',edit:'Edit',saveChanges:'Save changes',rsvpDone:'Thank you for your response!',demo:'Demo data'}
};
function initial(){return {lang:'fr',selected:null,weddings:[{id:'theuriet-omie-2027',couple:'Theuriet & Naomi',date:'',venue:'Lubumbashi, RDC',message:'C’est avec une immense joie et une profonde gratitude envers Dieu que nous avons le plaisir de vous annoncer notre union. Nous serions honorés de vous compter parmi ceux qui partageront avec nous ce moment précieux de notre histoire.',tables:[{id:'t1',name:'Table 01',capacity:8},{id:'t2',name:'Table 02',capacity:8},{id:'t3',name:'Table 03',capacity:10}],guests:[{id:'g1',name:'Jean & Marie',phone:'',seats:2,tableId:'t1',status:'confirmed',token:'NUP-2027-0085',arrived:false},{id:'g2',name:'Famille Kasongo',phone:'',seats:4,tableId:'t2',status:'pending',token:'NUP-2027-0086',arrived:false}]}]}}
let db;try{db=JSON.parse(localStorage.getItem(storeKey))||initial()}catch(e){db=initial()}
// Migration douce : ajoute les nouveaux champs sans effacer les données déjà enregistrées.
(db.weddings||[]).forEach(w=>{w.story=w.story||'';w.photo=w.photo||'';w.ceremony=w.ceremony||'';w.reception=w.reception||w.venue||'';w.mapUrl=w.mapUrl||'';w.musicUrl=w.musicUrl||'';w.dressCode=w.dressCode||'';w.program=w.program||'';w.websiteNote=w.websiteNote||'';w.message=w.message||translations[db.lang||'fr'].welcomeText;w.guests=w.guests||[];w.tables=w.tables||[];});
const t=k=>translations[db.lang][k]||k;
function persist(){localStorage.setItem(storeKey,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function wedding(){return db.weddings.find(w=>w.id===db.selected)||db.weddings[0]}
function allGuests(){return db.weddings.reduce((a,w)=>a.concat(w.guests),[])}
function showToast(msg){$('#toast-root').innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>$('#toast-root').innerHTML='',2400)}
function go(page){history.pushState({page},'',`#${page}`);render(page)}
function header(){return `<header class="topbar"><div class="brand"><div class="brand-mark">N</div><div><div class="brand-name">NUPTIA</div><div class="brand-sub">Wedding experiences</div></div></div><div class="top-actions"><select class="lang" onchange="setLang(this.value)"><option value="fr" ${db.lang==='fr'?'selected':''}>FR</option><option value="en" ${db.lang==='en'?'selected':''}>EN</option></select><button class="btn ghost" onclick="showToast('${t('demo')}')">✧ NUPTIA</button></div></header>`}
function shell(page,content){$('#app').innerHTML=header()+`<div class="layout"><aside class="sidebar"><div class="side-label">Workspace</div>${[['overview','⌂'],['weddings','♡'],['settings','✧'],['guests','♧'],['seating','▦'],['checkin','✓']].map(([k,i])=>`<button class="nav ${page===k?'active':''}" onclick="go('${k}')"><span class="ico">${i}</span>${t(k)}</button>`).join('')}</aside><main class="main">${content}<div class="footer">NUPTIA · ${t('adminNote')}</div></main></div>`}
function render(page='overview'){
 const params=new URLSearchParams(location.search);if(params.has('wedding')){renderInvite(params.get('wedding'),params.get('invite'));return}
 if(!['overview','weddings','settings','guests','seating','checkin'].includes(page))page='overview';
 if(page==='overview')return dashboard();
 if(page==='weddings')return weddingsPage();
 if(page==='settings')return settingsPage();
 if(page==='guests')return guestsPage();
 if(page==='seating')return seatingPage();
 if(page==='checkin')return checkinPage();
}
function dashboard(){let gs=allGuests();shell('overview',`<div class="head-row"><div><div class="eyebrow">NUPTIA / DASHBOARD</div><h1 class="page-title">${t('welcome')}</h1><div class="sub">${t('hello')}</div></div><button class="btn primary" onclick="openWeddingModal()">＋ ${t('newWedding')}</button></div><div class="cards"><div class="stat"><div class="stat-label">${t('active')}</div><div class="stat-num">${db.weddings.length}</div></div><div class="stat"><div class="stat-label">${t('guestsCount')}</div><div class="stat-num">${gs.length}</div></div><div class="stat"><div class="stat-label">${t('checked')}</div><div class="stat-num">${gs.filter(g=>g.arrived).length}</div></div></div><section class="panel"><div class="panel-head"><div><h3>${t('yourWeddings')}</h3><div class="small">Des espaces indépendants pour chaque couple</div></div><button class="btn" onclick="go('weddings')">${t('weddings')} →</button></div>${weddingCards()}</section>`)}
function weddingCards(){return `<div class="wedding-grid">${db.weddings.map(w=>`<article class="wedding-card"><div class="card-cover">A day to remember</div><div class="wedding-body"><h3>${esc(w.couple)}</h3><div class="meta">${w.date?esc(w.date):t('datePending')} · ${esc(w.venue||'')}</div><div class="actions"><button class="btn primary" onclick="selectWedding('${w.id}');go('settings')">Personnaliser</button><button class="btn" onclick="selectWedding('${w.id}');go('guests')">${t('open')}</button><button class="btn" onclick="publicLink('${w.id}')">${t('view')}</button></div></div></article>`).join('')}</div>`}
function weddingsPage(){shell('weddings',`<div class="head-row"><div><div class="eyebrow">NUPTIA / WORKSPACES</div><h1 class="page-title">${t('weddings')}</h1><div class="sub">Crée et administre un espace distinct pour chaque couple.</div></div><button class="btn primary" onclick="openWeddingModal()">＋ ${t('newWedding')}</button></div>${weddingCards()}`)}
function selectWedding(id){db.selected=id;persist()}
function settingsPage(){let w=wedding();if(!w)return; shell('settings',`<div class="head-row"><div><div class="eyebrow">NUPTIA / PERSONNALISATION</div><h1 class="page-title">${esc(w.couple)}</h1><div class="sub">Configurez l’invitation de ce mariage depuis votre téléphone.</div></div><button class="btn" onclick="publicLink('${w.id}')">Voir l’invitation ↗</button></div>
<section class="panel"><div class="panel-head"><div><h3>1. Les mariés et leur histoire</h3><div class="section-note">Ajoutez une belle photo et présentez votre histoire.</div></div></div><div class="editor-grid"><div class="field"><label>Noms du couple</label><input id="ed-couple" value="${esc(w.couple)}"></div><div class="field"><label>Date du mariage</label><input id="ed-date" type="date" value="${esc(w.date||'')}"></div><div class="field full"><label>Photo des mariés (depuis le téléphone)</label><input id="ed-photo" type="file" accept="image/*" onchange="previewWeddingPhoto(this)"><img id="photo-preview" class="photo-preview ${w.photo?'':'hidden'}" src="${w.photo||''}" alt="Aperçu de la photo des mariés">${w.photo?`<button class="btn" type="button" onclick="removeWeddingPhoto()" style="margin-top:8px">Retirer la photo</button>`:''}<div class="notice">Conseil : choisissez une photo nette. Elle sera optimisée pour limiter l’espace utilisé dans ce prototype.</div></div><div class="field full"><label>Histoire ou présentation du couple</label><textarea id="ed-story" placeholder="Racontez brièvement votre histoire…">${esc(w.story||'')}</textarea></div><div class="field full"><label>Message d’invitation</label><textarea id="ed-message">${esc(w.message||'')}</textarea></div></div></section>
<section class="panel"><div class="panel-head"><div><h3>2. Lieux et localisation</h3><div class="section-note">Indiquez les lieux et collez les liens Google Maps correspondants.</div></div></div><div class="editor-grid"><div class="field"><label>Lieu de la cérémonie</label><input id="ed-ceremony" value="${esc(w.ceremony||'')}" placeholder="Église / salle et adresse"></div><div class="field"><label>Lieu de la réception</label><input id="ed-reception" value="${esc(w.reception||w.venue||'')}" placeholder="Salle de réception et adresse"></div><div class="field full"><label>Lien Google Maps</label><input id="ed-map" type="url" value="${esc(w.mapUrl||'')}" placeholder="https://maps.google.com/…"></div></div></section>
<section class="panel"><div class="panel-head"><div><h3>3. Ambiance et programme</h3><div class="section-note">Ajoutez la musique, le dress code et les étapes de la journée.</div></div></div><div class="editor-grid"><div class="field full"><label>Lien direct vers la musique (MP3 ou fichier audio accessible)</label><input id="ed-music" type="url" value="${esc(w.musicUrl||'')}" placeholder="https://…/musique.mp3"><div class="notice">Utilisez un lien direct vers un fichier audio. Les liens de pages YouTube ou Spotify ne sont pas des liens audio directs.</div></div><div class="field"><label>Dress code</label><input id="ed-dress" value="${esc(w.dressCode||'')}" placeholder="Ex. Tenue de soirée, beige et doré"></div><div class="field"><label>Note complémentaire</label><input id="ed-note" value="${esc(w.websiteNote||'')}" placeholder="Ex. Merci d’arriver 30 minutes avant"></div><div class="field full"><label>Programme de la journée</label><textarea id="ed-program" placeholder="10h00 – Cérémonie\n14h00 – Réception\n18h00 – Soirée">${esc(w.program||'')}</textarea></div></div></section>
<div class="actions"><button class="btn primary" onclick="saveWeddingDetails()">Enregistrer les modifications</button><button class="btn" onclick="publicLink('${w.id}')">Prévisualiser l’invitation</button></div><p class="notice">Les modifications sont enregistrées dans le navigateur de cet appareil. La synchronisation en ligne entre organisateurs et appareils sera ajoutée dans une prochaine étape.</p>`)}
let pendingWeddingPhoto='';
function previewWeddingPhoto(input){let file=input.files&&input.files[0];if(!file)return;if(!file.type.startsWith('image/')){showToast('Choisissez un fichier image');return}if(file.size>12*1024*1024){showToast('Image trop volumineuse : choisissez une image de moins de 12 Mo');input.value='';return}let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let max=1100,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);pendingWeddingPhoto=canvas.toDataURL('image/jpeg',0.78);let preview=$('#photo-preview');preview.src=pendingWeddingPhoto;preview.classList.remove('hidden')};img.src=reader.result};reader.readAsDataURL(file)}
function removeWeddingPhoto(){pendingWeddingPhoto='';wedding().photo='';persist();render('settings')}
function saveWeddingDetails(){let w=wedding();w.couple=$('#ed-couple').value.trim()||w.couple;w.date=$('#ed-date').value;w.story=$('#ed-story').value.trim();w.message=$('#ed-message').value.trim();w.ceremony=$('#ed-ceremony').value.trim();w.reception=$('#ed-reception').value.trim();w.venue=w.reception||w.ceremony||w.venue;w.mapUrl=$('#ed-map').value.trim();w.musicUrl=$('#ed-music').value.trim();w.dressCode=$('#ed-dress').value.trim();w.websiteNote=$('#ed-note').value.trim();w.program=$('#ed-program').value.trim();if(pendingWeddingPhoto)w.photo=pendingWeddingPhoto;pendingWeddingPhoto='';try{persist();showToast('Modifications enregistrées');render('settings')}catch(e){showToast('Stockage saturé : réduisez la taille de la photo');}}
function guestsPage(){let w=wedding();shell('guests',`<div class="head-row"><div><div class="eyebrow">${esc(w.couple)} / GUESTS</div><h1 class="page-title">${t('guestTitle')}</h1><div class="sub">${w.guests.length} ${t('guestsCount').toLowerCase()}</div></div><button class="btn primary" onclick="openGuestModal()">＋ ${t('addGuest')}</button></div><section class="panel"><div class="panel-head"><h3>${esc(w.couple)}</h3><input style="max-width:240px;padding:10px;border:1px solid var(--line);border-radius:6px" placeholder="${t('search')}" oninput="filterGuests(this.value)"></div><div id="guest-table">${guestTable(w)}</div></section>`)}
function guestTable(w){if(!w.guests.length)return `<div class="empty">${t('noGuests')}</div>`;return `<div class="table-wrap"><table><thead><tr><th>${t('guestName')}</th><th>${t('seats')}</th><th>${t('table')}</th><th>${t('status')}</th><th>${t('invite')}</th></tr></thead><tbody>${w.guests.map(g=>`<tr data-name="${esc(g.name.toLowerCase())}"><td><strong>${esc(g.name)}</strong><div class="small">${esc(g.phone||'')}</div></td><td>${g.seats}</td><td><select onchange="assignTable('${g.id}',this.value)" style="padding:7px;border:1px solid var(--line);border-radius:5px"><option value="">${t('notAssigned')}</option>${w.tables.map(tb=>`<option value="${tb.id}" ${g.tableId===tb.id?'selected':''}>${esc(tb.name)}</option>`).join('')}</select></td><td><span class="pill ${g.status==='confirmed'?'ok':g.status==='declined'?'no':''}">${t(g.status)}</span></td><td><button class="btn" onclick="guestLink('${w.id}','${g.token}')">↗</button></td></tr>`).join('')}</tbody></table></div>`}
function filterGuests(q){document.querySelectorAll('#guest-table tbody tr').forEach(r=>r.style.display=r.dataset.name.includes(q.toLowerCase())?'':'none')}
function assignTable(gid,tid){let w=wedding(),g=w.guests.find(x=>x.id===gid),tb=w.tables.find(x=>x.id===tid);if(tb){let used=w.guests.filter(x=>x.tableId===tid&&x.id!==gid).reduce((a,x)=>a+x.seats,0);if(used+g.seats>tb.capacity){showToast('Capacité de la table dépassée');render('guests');return}}g.tableId=tid;persist();render('guests')}
function seatingPage(){let w=wedding();shell('seating',`<div class="head-row"><div><div class="eyebrow">${esc(w.couple)} / SEATING</div><h1 class="page-title">${t('seatingTitle')}</h1><div class="sub">L’organisateur garde le contrôle exclusif du placement.</div></div><button class="btn primary" onclick="openTableModal()">＋ ${t('addTable')}</button></div><div class="wedding-grid">${w.tables.map(tb=>{let list=w.guests.filter(g=>g.tableId===tb.id),used=list.reduce((a,g)=>a+g.seats,0);return `<section class="panel"><div class="panel-head"><h3>${esc(tb.name)}</h3><span class="pill">${used} / ${tb.capacity}</span></div><div class="small">${t('tableGuests')}</div>${list.length?list.map(g=>`<p style="font-size:13px;margin:12px 0 0">• ${esc(g.name)} <span class="small">(${g.seats})</span></p>`).join(''):`<div class="empty" style="margin-top:12px">Aucun invité placé</div>`}</section>`}).join('')||`<div class="empty">${t('noTables')}</div>`}</div>`)}
function checkinPage(){let w=wedding();shell('checkin',`<div class="head-row"><div><div class="eyebrow">${esc(w.couple)} / ARRIVALS</div><h1 class="page-title">${t('checkTitle')}</h1><div class="sub">${t('checkHint')}</div></div></div><section class="panel"><input id="check-search" placeholder="${t('search')}" oninput="drawCheckin(this.value)" style="width:100%;max-width:400px;padding:12px;border:1px solid var(--line);border-radius:6px"><div id="check-results" style="margin-top:18px">${checkRows(w,'')}</div></section>`)}
function checkRows(w,q){let a=w.guests.filter(g=>g.name.toLowerCase().includes(q.toLowerCase())||g.token.toLowerCase().includes(q.toLowerCase()));return a.length?a.map(g=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)"><div><strong>${esc(g.name)}</strong><div class="small">${esc(g.token)} · ${g.seats} place(s) · ${esc(w.tables.find(tb=>tb.id===g.tableId)?.name||t('notAssigned'))}</div></div>${g.arrived?`<span class="pill ok">${t('arrived')}</span>`:`<button class="btn gold" onclick="checkIn('${g.id}')">${t('mark')}</button>`}</div>`).join(''):`<div class="empty">${t('noGuests')}</div>`}
function drawCheckin(q){$('#check-results').innerHTML=checkRows(wedding(),q)}
function checkIn(id){let g=wedding().guests.find(x=>x.id===id);if(g){g.arrived=true;persist();render('checkin');showToast(t('arrived'))}}
function openModal(title,body,onSave){$('#modal-root').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2>${body}<div class="modal-actions"><button class="btn" onclick="closeModal()">${t('cancel')}</button><button class="btn primary" onclick="${onSave}">${t('save')}</button></div></div></div>`}
function closeModal(){$('#modal-root').innerHTML=''}
function openWeddingModal(){openModal(t('createTitle'),`<div class="form-grid"><div class="field full"><label>${t('couple')}</label><input id="f-couple" placeholder="Ex. Theuriet & Naomi"></div><div class="field"><label>${t('date')}</label><input id="f-date" type="date"></div><div class="field"><label>${t('venue')}</label><input id="f-venue" placeholder="Lubumbashi, RDC"></div></div><p class="notice">La date peut rester vide. Le compte à rebours restera désactivé tant qu’elle n’est pas définie.</p>`,'saveWedding()')}
function saveWedding(){let couple=$('#f-couple').value.trim();if(!couple){showToast('Indique les noms du couple');return}let id='w-'+Date.now();db.weddings.push({id,couple,date:$('#f-date').value,venue:$('#f-venue').value.trim(),message:translations[db.lang].welcomeText,tables:[],guests:[]});db.selected=id;persist();closeModal();go('weddings')}
function openGuestModal(){openModal(t('addGuest'),`<div class="form-grid"><div class="field full"><label>${t('guestName')}</label><input id="f-name" placeholder="Jean & Marie"></div><div class="field"><label>${t('email')}</label><input id="f-phone" placeholder="+243…"></div><div class="field"><label>${t('seats')}</label><input id="f-seats" type="number" min="1" max="20" value="1"></div></div>`,'saveGuest()')}
function saveGuest(){let name=$('#f-name').value.trim();if(!name){showToast('Indique le nom de l’invité');return}let w=wedding(),n=String(w.guests.length+1).padStart(4,'0');w.guests.push({id:'g'+Date.now(),name,phone:$('#f-phone').value.trim(),seats:Math.max(1,Number($('#f-seats').value)||1),tableId:'',status:'pending',token:'NUP-'+new Date().getFullYear()+'-'+n,arrived:false});persist();closeModal();render('guests')}
function openTableModal(){openModal(t('addTable'),`<div class="form-grid"><div class="field"><label>${t('tableName')}</label><input id="f-tname" placeholder="Table 04"></div><div class="field"><label>${t('capacity')}</label><input id="f-cap" type="number" min="1" value="8"></div></div>`,'saveTable()')}
function saveTable(){let name=$('#f-tname').value.trim();if(!name){showToast('Donne un nom à la table');return}wedding().tables.push({id:'t'+Date.now(),name,capacity:Math.max(1,Number($('#f-cap').value)||8)});persist();closeModal();render('seating')}
function guestLink(wid,token){let url=location.origin+location.pathname+'?wedding='+encodeURIComponent(wid)+'&invite='+encodeURIComponent(token);openShare(url)}
function publicLink(wid){let url=location.origin+location.pathname+'?wedding='+encodeURIComponent(wid);openShare(url)}
function openShare(url){openModal(t('invite'),`<div class="field"><label>URL</label><input id="share-url" value="${esc(url)}" readonly></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="copyShare()">⧉ ${t('copy')}</button><button class="btn gold" onclick="whatsShare()">◉ ${t('share')}</button></div><p class="notice">Pour l’instant, ce prototype fonctionne sur cet appareil. Pour partager un vrai lien public, il faudra publier le site sur Internet.</p>`,'closeModal()')}
function copyShare(){let v=$('#share-url').value;navigator.clipboard?.writeText(v).then(()=>showToast('Lien copié')).catch(()=>showToast(v))}
function whatsShare(){let v=$('#share-url').value;window.open('https://wa.me/?text='+encodeURIComponent('Voici votre invitation : '+v),'_blank')}
function renderInvite(wid,token){let w=db.weddings.find(x=>x.id===wid);if(!w){$('#app').innerHTML=`<div class="invite-page"><div class="invite-card"><h1 class="invite-title">${t('notFound')}</h1><a href="${location.pathname}">${t('back')}</a></div></div>`;return}let g=token?w.guests.find(x=>x.token===token):null;if(token&&!g){$('#app').innerHTML=`<div class="invite-page"><div class="invite-card"><h1 class="invite-title">${t('notFound')}</h1></div></div>`;return}
let table=g?w.tables.find(x=>x.id===g.tableId):null;$('#app').innerHTML=`<div class="invite-page"><article class="invite-card"><div class="invite-kicker">✧ NUPTIA · ${t('invited')} ✧</div><div class="invite-title">${esc(w.couple.split('&')[0]||w.couple)}<div class="amp">&</div>${esc(w.couple.split('&')[1]||'')}</div><div class="invite-rule"></div><p class="invite-copy">${esc(w.message||t('welcomeText'))}</p>${w.photo?`<img class="invite-photo" src="${w.photo}" alt="Photo des mariés">`:''}${w.story?`<div class="invite-extra"><h3>Notre histoire</h3><p>${esc(w.story)}</p></div>`:''}<div class="invite-details"><div class="detail"><strong>${w.date?new Date(w.date+'T12:00:00').toLocaleDateString(db.lang==='fr'?'fr-FR':'en-GB',{day:'numeric',month:'long',year:'numeric'}):'À venir'}</strong><span>${t('dateLabel')}</span></div><div class="detail"><strong>${esc(w.venue||'À préciser')}</strong><span>${t('placeLabel')}</span></div></div>${(w.ceremony||w.reception||w.program||w.dressCode||w.websiteNote)?`<div class="invite-extra">${w.ceremony?`<h3>Cérémonie</h3><p>${esc(w.ceremony)}</p>`:''}${w.reception?`<h3>Réception</h3><p>${esc(w.reception)}</p>`:''}${w.dressCode?`<h3>Dress code</h3><p>${esc(w.dressCode)}</p>`:''}${w.program?`<h3>Programme</h3><p>${esc(w.program)}</p>`:''}${w.websiteNote?`<p>${esc(w.websiteNote)}</p>`:''}${w.mapUrl?`<p><a href="${esc(w.mapUrl)}" target="_blank" rel="noopener">Voir l’itinéraire sur Google Maps ↗</a></p>`:''}</div>`:''}${w.musicUrl?`<div class="music-player"><div class="small">Notre musique</div><audio controls preload="none" src="${esc(w.musicUrl)}">Votre navigateur ne prend pas en charge la lecture audio.</audio></div>`:''}${g?`<div class="guest-box"><div class="small">${t('invited')}</div><strong>${esc(g.name)}</strong><p class="small">${t('places')} : ${g.seats} · ${t('yourTable')} : ${esc(table?.name||t('notAssigned'))}</p><div id="qr" class="qr"></div><div class="small">${t('scan')} : ${esc(g.token)}</div><div class="actions" style="justify-content:center;margin-top:14px"><button class="btn primary" onclick="guestRsvp('${wid}','${g.token}')">${t('rsvp')}</button></div></div>`:''}<div class="invite-rule"></div><div class="small">NUPTIA · Chaque union mérite une belle invitation.</div><div style="margin-top:18px"><button class="lang" onclick="setLang('${db.lang==='fr'?'en':'fr'}');renderInvite('${wid}','${token||''}')">${db.lang==='fr'?'English':'Français'}</button></div></article></div>`;
if(g&&window.QRCode){new QRCode($('#qr'),{text:g.token,width:112,height:112,colorDark:'#29251f',colorLight:'#fffdf9',correctLevel:QRCode.CorrectLevel.M})}}
function guestRsvp(wid,token){let w=db.weddings.find(x=>x.id===wid),g=w.guests.find(x=>x.token===token);g.status='confirmed';persist();showToast(t('rsvpDone'))}
function setLang(v){db.lang=v;persist();if(location.search){let p=new URLSearchParams(location.search);renderInvite(p.get('wedding'),p.get('invite'))}else render(location.hash.slice(1)||'overview')}
window.addEventListener('popstate',()=>render(location.hash.slice(1)||'overview'));
render(location.hash.slice(1)||'overview');
</script>
</body>
</html>
