<style>
:root{--ink:#29251f;--muted:#81796f;--gold:#a9864d;--gold2:#d7bd8d;--cream:#f7f3ec;--paper:#fffdf9;--line:#e9e1d5;--green:#55745f;--red:#a75e54;--shadow:0 14px 40px #4a38200d}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.serif{font-family:"Playfair Display",serif}
.app{min-height:100vh}
.topbar{height:76px;padding:0 clamp(18px,5vw,64px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fffdf9eF;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;border:1px solid var(--gold2);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-family:Georgia;font-size:21px}
.brand-name{font-family:"Playfair Display",serif;font-size:22px;letter-spacing:3px}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:1.8px;text-transform:uppercase}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 15px;border-radius:7px;font-weight:600;font-size:13px;transition:all .15s}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}
.btn.gold{background:var(--gold);color:white;border-color:var(--gold)}
.btn.danger{background:#fff5f4;color:var(--red);border-color:#e6c4bf}
.btn.danger:hover{background:var(--red);color:white;border-color:var(--red)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:12px}
.layout{display:grid;grid-template-columns:245px 1fr;max-width:1440px;margin:auto;min-height:calc(100vh - 76px)}
.sidebar{padding:26px 16px;border-right:1px solid var(--line);background:#fbf8f2}
.side-label{font-size:10px;letter-spacing:1.6px;color:#a59b8e;text-transform:uppercase;padding:0 12px;margin:14px 0 8px}
.nav{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;padding:11px 12px;border-radius:7px;color:#6f685e;text-align:left;margin:2px 0;font-size:13px}
.nav.active,.nav:hover{background:#efe7da;color:var(--ink);font-weight:600}
.nav .ico{width:20px;text-align:center;color:var(--gold)}
.active-wedding-badge{margin:0 8px 14px;padding:10px 12px;background:#f3ece0;border:1px solid var(--line);border-radius:8px;font-size:12px}
.active-wedding-badge strong{display:block;font-family:"Playfair Display",serif;font-size:15px;color:var(--ink);margin-top:2px}
.main{padding:clamp(22px,4vw,50px);min-width:0}
.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.page-title{font:500 clamp(28px,4vw,40px) "Playfair Display",serif;margin:8px 0}
.sub{color:var(--muted);font-size:14px;line-height:1.7}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:24px 0}
.stat,.panel,.wedding-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.stat{padding:18px}
.stat-label{font-size:12px;color:var(--muted)}
.stat-num{font:500 30px "Playfair Display",serif;margin-top:6px}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px}
.panel{padding:22px;margin:18px 0}
.panel h3{font:500 21px "Playfair Display",serif;margin:0 0 6px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.wedding-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.wedding-card{overflow:hidden;position:relative}
.wedding-card.selected{border-color:var(--gold);box-shadow:0 14px 40px #a9864d1f}
.card-cover{height:115px;background:linear-gradient(120deg,#e9dfce,#f8f2e8 60%,#d9c7a8);display:flex;align-items:center;justify-content:center;color:#a9864d;font:italic 26px "Playfair Display",serif;background-size:cover;background-position:center}
.wedding-body{padding:18px}
.wedding-body h3{font:500 23px "Playfair Display",serif;margin:0 0 6px}
.meta{font-size:12px;color:var(--muted);margin:5px 0 14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;color:#8d8377;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:12px 10px;border-bottom:1px solid var(--line)}
td{padding:13px 10px;border-bottom:1px solid #f0ebe3}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:#f1eadf;color:#796341;font-size:10px;font-weight:700}
.pill.ok{background:#eaf1eb;color:var(--green)}
.pill.no{background:#f7eae7;color:var(--red)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field label{display:block;font-size:11px;color:#766e63;margin-bottom:7px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:#fffdf9;color:var(--ink);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{min-height:95px;resize:vertical}
.full{grid-column:1/-1}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;font-size:13px}
.hidden{display:none!important}
.modal-back{position:fixed;inset:0;background:#201b16a6;z-index:20;display:grid;place-items:center;padding:18px}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:12px;padding:26px;box-shadow:0 25px 80px #0003}
.modal h2{font:500 26px "Playfair Display",serif;margin:0 0 18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.notice{font-size:11px;color:var(--muted);line-height:1.6;margin-top:10px}
.invite-page{min-height:100vh;background:#f2ece2;padding:26px 14px;display:grid;place-items:center}
.invite-card{width:min(760px,100%);background:#fffdf9;border:1px solid #dfd2bd;padding:clamp(28px,7vw,64px);text-align:center;position:relative;box-shadow:0 20px 80px #4a382014}
.invite-card:before{content:"";position:absolute;inset:12px;border:1px solid #e8dcc9;pointer-events:none}
.invite-kicker{letter-spacing:3px;text-transform:uppercase;font-size:10px;color:var(--gold)}
.invite-title{font:400 clamp(34px,7vw,60px) "Playfair Display",serif;line-height:1.1;margin:22px 0 12px}
.amp{font:italic 30px "Playfair Display",serif;color:var(--gold)}
.invite-copy{max-width:520px;margin:20px auto;color:#71685d;line-height:1.9;font-size:14px}
.invite-rule{width:70px;height:1px;background:var(--gold2);margin:24px auto}
.invite-details{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin:26px 0}
.detail strong{display:block;font:500 20px "Playfair Display",serif;margin-bottom:4px}
.detail span{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#968a7a}
.guest-box{margin:26px auto 0;padding:20px;border:1px solid var(--line);max-width:440px;background:#fbf8f2}
.guest-box strong{font:500 22px "Playfair Display",serif}
.qr{display:flex;justify-content:center;margin:15px auto}
.lang{font-size:12px;border:1px solid var(--line);background:white;padding:8px 10px;border-radius:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#29251f;color:white;padding:12px 18px;border-radius:8px;font-size:12px;z-index:50;box-shadow:0 8px 25px #0004}
.small{font-size:11px;color:var(--muted)}
.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.check-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:#fffdf9;font-size:13px;cursor:pointer}
.check-item input{width:16px;height:16px;accent-color:var(--gold)}
.footer{font-size:10px;color:#a39a8d;text-align:center;margin:30px 0 10px}
.photo-preview{width:100%;max-width:260px;max-height:220px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;margin-top:10px}
.editor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.section-note{font-size:12px;color:var(--muted);line-height:1.6}
.invite-photo{width:min(100%,520px);max-height:360px;object-fit:cover;margin:20px auto 4px;border-radius:4px}
.invite-extra{margin:24px auto;max-width:540px;text-align:left;padding:18px;border-top:1px solid var(--line)}
.invite-extra h3{font:500 21px "Playfair Display",serif;margin:0 0 8px}
.invite-extra p{font-size:13px;line-height:1.8;color:#71685d;white-space:pre-line;margin:0 0 14px}
.invite-extra a{color:var(--gold);font-weight:700;text-decoration:none}
.music-player{margin:20px auto;max-width:420px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fbf8f2}
.music-player audio{width:100%;margin-top:6px}
.floor-plan{background:#f5efe4;border:1px solid var(--line);border-radius:12px;padding:22px;position:relative}
.floor-stage{text-align:center;padding:10px 18px;border:1px solid var(--gold2);background:#fffdf9;border-radius:30px;max-width:280px;margin:0 auto 24px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.floor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.floor-table{background:#fffdf9;border:2px solid var(--gold2);border-radius:14px;padding:16px;text-align:center;box-shadow:0 8px 20px #4a38200a}
.floor-table.full-cap{border-color:var(--green)}
.floor-circle{width:76px;height:76px;border-radius:50%;border:1px dashed var(--gold);margin:0 auto 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fbf7ef}
.bar-bg{height:8px;background:#ece4d7;border-radius:99px;overflow:hidden;margin:8px 0}
.bar-fill{height:100%;background:var(--gold);border-radius:99px}
.guestbook-item{padding:14px;border:1px solid var(--line);border-radius:8px;background:#fffdf9;margin-bottom:10px;text-align:left}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.sync-dot.online{background:var(--green)}
code.sql{display:block;background:#24201b;color:#f4ede2;padding:12px;border-radius:8px;font-size:11px;overflow:auto;white-space:pre;line-height:1.5;margin-top:8px}

@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:flex;overflow:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);gap:4px}
  .side-label,.active-wedding-badge{display:none}
  .nav{white-space:nowrap;width:auto;padding:9px 11px}
  .nav .ico{width:auto}
  .main{padding:20px 15px}
  .cards{grid-template-columns:1fr 1fr}
  .wedding-grid,.editor-grid{grid-template-columns:1fr}
  .head-row{align-items:flex-start;flex-direction:column}
  .topbar{height:66px}
  .brand-name{font-size:19px}
}
@media(max-width:500px){
  .cards{grid-template-columns:1fr 1fr;gap:9px}
  .stat{padding:14px}
  .stat-num{font-size:25px}
  .form-grid,.check-grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .top-actions .btn{padding:8px 10px}
  .brand-sub{display:none}
  .invite-details{gap:16px}
}
</style>
</head>

}

let cloudCfg = { url: '', anonKey: '', userEmail: '' };
try {
  cloudCfg = Object.assign(cloudCfg, JSON.parse(localStorage.getItem(cloudCfgKey) || '{}'));
} catch (e) {}

let supabaseClient = null;
let currentUser = null;

function initSupabase() {
  if (cloudCfg.url && cloudCfg.anonKey && window.supabase) {
    try {
      supabaseClient = window.supabase.createClient(cloudCfg.url.trim(), cloudCfg.anonKey.trim());
      supabaseClient.auth.getSession().then(({ data }) => {
        currentUser = data?.session?.user || null;
        if (currentUser) syncFromCloud(true);
      });
    } catch (e) {
      supabaseClient = null;
    }
  }
}
initSupabase();

const t = k => (translations[db.lang] && translations[db.lang][k]) || translations.fr[k] || k;

function persist(skipCloud) {
  try {
    localStorage.setItem(storeKey, JSON.stringify(db));
  } catch (e) {
    showToast('Stockage navigateur saturé : réduisez la taille du fichier média.');
  }
  if (!skipCloud && supabaseClient && currentUser) {
    pushToCloud();
  }
}

function esc(s = '') {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function wedding() {
  if (!db.weddings.length) return null;
  return db.weddings.find(w => w.id === db.selected) || db.weddings[0];
}

function allGuests() {
  return db.weddings.reduce((a, w) => a.concat(w.guests || []), []);
}

function showToast(msg) {
  $('#toast-root').innerHTML = `<div class="toast">${esc(msg)}</div>`;
  setTimeout(() => { $('#toast-root').innerHTML = ''; }, 2600);
}

function go(page) {
  history.pushState({ page }, '', `#${page}`);
  render(page);
}

function buildMapLink(w) {
  if (w.gpsLat && w.gpsLng) {
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(w.gpsLat + ',' + w.gpsLng)}`;
  }
  if (w.mapUrl) return w.mapUrl;
  const query = w.reception || w.ceremony || w.venue;
  return query ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}` : '';
}

function formatDressCode(w) {
  const dict = DRESS_OPTIONS[db.lang] || DRESS_OPTIONS.fr;
  const labels = (w.dressCodes || []).map(id => dict.find(o => o.id === id)?.label).filter(Boolean);
  if (w.dressCode) labels.push(w.dressCode);
  return labels.join(' • ');
}

  }
  const valid = ['overview', 'weddings', 'settings', 'guests', 'seating', 'checkin', 'stats', 'guestbook', 'sync'];
  if (!valid.includes(page)) page = 'overview';
  if (page === 'overview') return dashboard();
  if (page === 'weddings') return weddingsPage();
  if (page === 'settings') return settingsPage();
  if (page === 'guests') return guestsPage();

}

let pendingWeddingPhoto = '';
let pendingMusicData = '';
let pendingMusicName = '';

function capturePhoneGps() {
  if (!navigator.geolocation) {
    showToast('Géolocalisation non disponible sur ce navigateur');
    return;
  }
  showToast('Recherche de votre position GPS…');
  navigator.geolocation.getCurrentPosition(
    pos => {
      $('#ed-lat').value = pos.coords.latitude.toFixed(6);
      $('#ed-lng').value = pos.coords.longitude.toFixed(6);
      showToast('Coordonnées GPS capturées !');
    },
    () => showToast('Impossible de récupérer le GPS (autorisez la localisation)')
  );
}

function previewWeddingPhoto(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    showToast('Choisissez un fichier image');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1000;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      pendingWeddingPhoto = canvas.toDataURL('image/jpeg', 0.76);
      const preview = $('#photo-preview');
      preview.src = pendingWeddingPhoto;
      preview.classList.remove('hidden');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function removeWeddingPhoto() {
  pendingWeddingPhoto = '';
  wedding().photo = '';
  persist();
  render('settings');
}

function handleMusicFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 4.5 * 1024 * 1024 && !supabaseClient) {
    showToast('Audio > 4,5 Mo : utilisez un fichier plus léger ou connectez Supabase.');
    input.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    pendingMusicData = reader.result;
    pendingMusicName = file.name;
    $('#music-status').innerHTML = `Prêt à enregistrer : <strong>${esc(file.name)}</strong>`;
  };
  reader.readAsDataURL(file);
}

function removeWeddingMusic() {
  pendingMusicData = '';
  pendingMusicName = '';
  const w = wedding();
  w.musicData = '';
  w.musicName = '';

  persist();
  showToast('Modifications enregistrées');
  render('settings');
}

function filterGuests(q) {
  document.querySelectorAll('#guest-table tbody tr').forEach(r => {
    r.style.display = r.dataset.name.includes(q.toLowerCase()) ? '' : 'none';
  });

function assignTable(gid, tid) {
  const w = wedding();
  const g = w.guests.find(x => x.id === gid);
  const tb = w.tables.find(x => x.id === tid);
  if (tb) {
    const used = w.guests.filter(x => x.tableId === tid && x.id !== gid).reduce((a, x) => a + x.seats, 0);
    if (used + g.seats > tb.capacity) {
      showToast('Capacité de la table dépassée');
      render('guests');
      return;
    }
  }

async function cloudSignUp() {
  const email = $('#auth-email').value.trim();

  if (!email || !password) return showToast('Entrez email et mot de passe');
  const { data, error } = await supabaseClient.auth.signUp({ email, password });
  if (error) return showToast(error.message);
  cloudCfg.userEmail = email;
  localStorage.setItem(cloudCfgKey, JSON.stringify(cloudCfg));
  currentUser = data.user;
  showToast('Compte créé ! Vérifiez votre boîte mail si confirmation activée.');
  render('sync');
}

async function cloudSignIn() {
  const email = $('#auth-email').value.trim();
  const password = $('#auth-pass').value;
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if (error) return showToast(error.message);
  cloudCfg.userEmail = email;
  localStorage.setItem(cloudCfgKey, JSON.stringify(cloudCfg));
  currentUser = data.user;
  await syncFromCloud(false);
  render('sync');
}

async function cloudSignOut() {
  await supabaseClient.auth.signOut();
  currentUser = null;
  render('sync');
}

async function pushToCloud(manual) {
  if (!supabaseClient || !currentUser) return;
  const { error } = await supabaseClient.from('nuptia_workspaces').upsert({
    user_id: currentUser.id,
    payload: db,
    updated_at: new Date().toISOString()
  });
  if (error && manual) showToast('Erreur sync : ' + error.message);
  else if (manual) showToast('Données synchronisées vers le cloud !');
}

async function syncFromCloud(silent) {
  if (!supabaseClient || !currentUser) return;
  const { data, error } = await supabaseClient.from('nuptia_workspaces').select('payload').eq('user_id', currentUser.id).maybeSingle();
  if (error) {
    if (!silent) showToast(error.message);
    return;
  }
  if (data && data.payload && Array.isArray(data.payload.weddings)) {
    db = data.payload;
    persist(true);
    if (!silent) showToast('Données récupérées depuis le cloud !');
  } else {
    await pushToCloud(false);
  }
}

function downloadBackup() {
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `NUPTIA-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  showToast('Sauvegarde téléchargée');
}

function restoreBackup(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!Array.isArray(parsed.weddings)) throw new Error('Format invalide');
      db = parsed;
      persist();
      showToast('Sauvegarde restaurée avec succès');
      render('overview');
    } catch (e) {
      showToast('Fichier de sauvegarde invalide');
    }
  };
  reader.readAsText(file);
}

function renderCountdown(dateStr) {
  if (!dateStr) return '';
  const target = new Date(dateStr + 'T12:00:00').getTime();
  const diff = target - Date.now();
  if (isNaN(target) || diff <= 0) return '';
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  return `<div style="margin:18px auto;padding:12px 18px;border:1px solid var(--gold2);border-radius:8px;max-width:340px;background:#fbf8f2">
    <div class="small" style="text-transform:uppercase;letter-spacing:1.5px;color:var(--gold)">${t('countdownLabel')}</div>
    <div style="font:500 22px 'Playfair Display',serif;margin-top:4px">${days} ${t('days')} · ${hours} ${t('hours')} · ${mins} ${t('mins')}</div>

}

    <p class="invite-copy">${esc(w.message || t('welcomeText'))}</p>
    ${w.photo ? `<img class="invite-photo" src="${w.photo}" alt="Photo des mariés">` : ''}
    ${w.story ? `<div class="invite-extra"><h3>Notre histoire</h3><p>${esc(w.story)}</p></div>` : ''}

    <div class="invite-details">
      <div class="detail">
        <strong>${w.date ? new Date(w.date + 'T12:00:00').toLocaleDateString(db.lang === 'fr' ? 'fr-FR' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : t('datePending')}</strong>
        <span>${t('dateLabel')}</span>
      </div>
      <div class="detail">
        <strong>${esc(w.venue || 'À préciser')}</strong>
        <span>${t('placeLabel')}</span>
      </div>
    </div>

    ${renderCountdown(w.date)}

    ${(w.ceremony || w.reception || w.program || dressText || w.websiteNote || mapHref) ? `<div class="invite-extra">
      ${w.ceremony ? `<h3>Cérémonie</h3><p>${esc(w.ceremony)}</p>` : ''}
      ${w.reception ? `<h3>Réception</h3><p>${esc(w.reception)}</p>` : ''}
      ${dressText ? `<h3>Dress code</h3><p>${esc(dressText)}</p>` : ''}
      ${w.program ? `<h3>Programme</h3><p>${esc(w.program)}</p>` : ''}
      ${w.websiteNote ? `<p>${esc(w.websiteNote)}</p>` : ''}
      ${mapHref ? `<p><a href="${esc(mapHref)}" target="_blank" rel="noopener">${t('map')}</a></p>` : ''}
    </div>` : ''}

    ${audioSrc ? `<div class="music-player"><div class="small">♫ Notre musique ${w.musicName ? '— ' + esc(w.musicName) : ''}</div><audio controls preload="metadata" src="${esc(audioSrc)}"></audio></div>` : ''}

    ${g ? `<div class="guest-box">
      <div class="small">${t('invited')}</div>
      <strong>${esc(g.name)}</strong>
      <p class="small">${t('places')} : ${g.seats} · ${t('yourTable')} : ${esc(table?.name || t('notAssigned'))}</p>
      <div style="margin:8px 0"><span class="pill ${g.status === 'confirmed' ? 'ok' : g.status === 'declined' ? 'no' : ''}">${t(g.status)}</span></div>
      <div id="qr" class="qr"></div>
      <div class="small">${t('scan')} : ${esc(g.token)}</div>
      <div class="actions" style="justify-content:center;margin-top:14px">
        <button class="btn primary" onclick="guestRsvp('${wid}','${g.token}','confirmed')">${t('rsvp')}</button>
        <button class="btn" onclick="guestRsvp('${wid}','${g.token}','declined')">${t('declineRsvp')}</button>
      </div>
    </div>` : ''}

    <div class="invite-extra">
      <h3>${t('guestbookTitle')}</h3>
      <div class="field" style="margin-bottom:8px"><input id="wish-author" value="${g ? esc(g.name) : ''}" placeholder="${t('yourName')}"></div>
      <div class="field" style="margin-bottom:8px"><textarea id="wish-text" style="min-height:70px" placeholder="${t('yourWish')}"></textarea></div>
      <button class="btn gold sm" onclick="submitWish('${wid}','${token || ''}')">${t('sendWish')}</button>
      <div style="margin-top:14px">
        ${(w.wishes || []).slice().reverse().map(item => `<div class="guestbook-item"><strong>${esc(item.author)}</strong><p style="margin:4px 0 0">${esc(item.text)}</p></div>`).join('')}
      </div>
    </div>

    <div class="invite-rule"></div>
    <div class="small">NUPTIA · Chaque union mérite une belle invitation.</div>
    <div style="margin-top:16px">
      <button class="lang" onclick="setLang('${db.lang === 'fr' ? 'en' : 'fr'}');renderInvite('${wid}','${token || ''}')">${db.lang === 'fr' ? 'English' : 'Français'}</button>
    </div>
  </article></div>`;

  if (g && window.QRCode) {
    new QRCode($('#qr'), {
      text: g.token,
      width: 112,
      height: 112,
      colorDark: '#29251f',
      colorLight: '#fffdf9',
      correctLevel: QRCode.CorrectLevel.M
    });
  }
}

function guestRsvp(wid, token, status) {
  const w = db.weddings.find(x => x.id === wid);
  const g = w?.guests.find(x => x.token === token);
  if (!g) return;
  g.status = status;
  persist();
  showToast(status === 'confirmed' ? t('rsvpDone') : t('rsvpDeclinedDone'));
  renderInvite(wid, token);
}

function submitWish(wid, token) {
  const w = db.weddings.find(x => x.id === wid);
  if (!w) return;
  const author = $('#wish-author').value.trim();
  const text = $('#wish-text').value.trim();
  if (!author || !text) {
    showToast('Indiquez votre nom et votre message');
    return;
  }
  w.wishes = w.wishes || [];
  w.wishes.push({ id: 'wish-' + Date.now(), author, text, createdAt: new Date().toISOString() });
  persist();
  showToast(t('wishSent'));
  renderInvite(wid, token);
}

function setLang(v) {
  db.lang = v;
  persist(true);
  if (location.search) {
    const p = new URLSearchParams(location.search);
    renderInvite(p.get('wedding'), p.get('invite'));
  } else {
    render(location.hash.slice(1) || 'overview');
  }
}

window.addEventListener('popstate', () => render(location.hash.slice(1) || 'overview'));
render(location.hash.slice(1) || 'overview');
</script>
  <script type="module" src="./nuptia-app.js"></script>
</body>
  <div id="role-bar">
  <input id="role-code-input" type="password" placeholder="Code PIN" />
  <button id="role-login-btn" type="button">Valider</button>
  <button id="role-logout-btn" type="button">Déconnexion</button>
  <span id="role-status"></span>
</div>
</html>
