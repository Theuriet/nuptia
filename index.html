<style>
:root{--ink:#29251f;--muted:#81796f;--gold:#a9864d;--gold2:#d7bd8d;--cream:#f7f3ec;--paper:#fffdf9;--line:#e9e1d5;--green:#55745f;--red:#a75e54;--shadow:0 14px 40px #4a38200d}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.serif{font-family:"Playfair Display",serif}
.app{min-height:100vh}
.topbar{height:76px;padding:0 clamp(18px,5vw,64px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fffdf9eF;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:38px;height:38px;border:1px solid var(--gold2);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-family:Georgia;font-size:21px}
.brand-name{font-family:"Playfair Display",serif;font-size:22px;letter-spacing:3px}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:1.8px;text-transform:uppercase}
.top-actions{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 15px;border-radius:7px;font-weight:600;font-size:13px;transition:all .15s}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--ink);color:white;border-color:var(--ink)}
.btn.gold{background:var(--gold);color:white;border-color:var(--gold)}
.btn.danger{background:#fff5f4;color:var(--red);border-color:#e6c4bf}
.btn.danger:hover{background:var(--red);color:white;border-color:var(--red)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:12px}
.btn.online-pill{background:#eaf1eb;border-color:#b7d1bc;color:var(--green)}
.layout{display:grid;grid-template-columns:245px 1fr;max-width:1440px;margin:auto;min-height:calc(100vh - 76px)}
.sidebar{padding:26px 16px;border-right:1px solid var(--line);background:#fbf8f2}
.side-label{font-size:10px;letter-spacing:1.6px;color:#a59b8e;text-transform:uppercase;padding:0 12px;margin:14px 0 8px}
.nav{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;padding:11px 12px;border-radius:7px;color:#6f685e;text-align:left;margin:2px 0;font-size:13px}
.nav.active,.nav:hover{background:#efe7da;color:var(--ink);font-weight:600}
.nav .ico{width:20px;text-align:center;color:var(--gold)}
.active-wedding-badge{margin:0 8px 14px;padding:10px 12px;background:#f3ece0;border:1px solid var(--line);border-radius:8px;font-size:12px}
.active-wedding-badge strong{display:block;font-family:"Playfair Display",serif;font-size:15px;color:var(--ink);margin-top:2px}
.main{padding:clamp(22px,4vw,50px);min-width:0}
.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.page-title{font:500 clamp(28px,4vw,40px) "Playfair Display",serif;margin:8px 0}
.sub{color:var(--muted);font-size:14px;line-height:1.7}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:24px 0}
.stat,.panel,.wedding-card{background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.stat{padding:18px}
.stat-label{font-size:12px;color:var(--muted)}
.stat-num{font:500 30px "Playfair Display",serif;margin-top:6px}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px}
.panel{padding:22px;margin:18px 0}
.panel h3{font:500 21px "Playfair Display",serif;margin:0 0 6px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.wedding-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.wedding-card{overflow:hidden;position:relative}
.wedding-card.selected{border-color:var(--gold);box-shadow:0 14px 40px #a9864d1f}
.card-cover{height:115px;background:linear-gradient(120deg,#e9dfce,#f8f2e8 60%,#d9c7a8);display:flex;align-items:center;justify-content:center;color:#a9864d;font:italic 26px "Playfair Display",serif;background-size:cover;background-position:center}
.wedding-body{padding:18px}
.wedding-body h3{font:500 23px "Playfair Display",serif;margin:0 0 6px}
.meta{font-size:12px;color:var(--muted);margin:5px 0 14px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.table-wrap{overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;color:#8d8377;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:12px 10px;border-bottom:1px solid var(--line)}
td{padding:13px 10px;border-bottom:1px solid #f0ebe3}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:#f1eadf;color:#796341;font-size:10px;font-weight:700}
.pill.ok{background:#eaf1eb;color:var(--green)}
.pill.no{background:#f7eae7;color:var(--red)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field label{display:block;font-size:11px;color:#766e63;margin-bottom:7px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:#fffdf9;color:var(--ink);outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}
.field textarea{min-height:95px;resize:vertical}
.full{grid-column:1/-1}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;font-size:13px}
.hidden{display:none!important}
.modal-back{position:fixed;inset:0;background:#201b16a6;z-index:20;display:grid;place-items:center;padding:18px}
.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:12px;padding:26px;box-shadow:0 25px 80px #0003}
.modal h2{font:500 26px "Playfair Display",serif;margin:0 0 18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;flex-wrap:wrap}
.notice{font-size:11px;color:var(--muted);line-height:1.6;margin-top:10px}
.invite-page{min-height:100vh;background:#f2ece2;padding:26px 14px;display:grid;place-items:center}
.invite-card{width:min(760px,100%);background:#fffdf9;border:1px solid #dfd2bd;padding:clamp(28px,7vw,64px);text-align:center;position:relative;box-shadow:0 20px 80px #4a382014}
.invite-card:before{content:"";position:absolute;inset:12px;border:1px solid #e8dcc9;pointer-events:none}
.invite-kicker{letter-spacing:3px;text-transform:uppercase;font-size:10px;color:var(--gold)}
.invite-title{font:400 clamp(34px,7vw,60px) "Playfair Display",serif;line-height:1.1;margin:22px 0 12px}
.amp{font:italic 30px "Playfair Display",serif;color:var(--gold)}
.invite-copy{max-width:520px;margin:20px auto;color:#71685d;line-height:1.9;font-size:14px}
.invite-rule{width:70px;height:1px;background:var(--gold2);margin:24px auto}
.invite-details{display:flex;justify-content:center;gap:28px;flex-wrap:wrap;margin:26px 0}
.detail strong{display:block;font:500 20px "Playfair Display",serif;margin-bottom:4px}
.detail span{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#968a7a}
.guest-box{margin:26px auto 0;padding:20px;border:1px solid var(--line);max-width:440px;background:#fbf8f2}
.guest-box strong{font:500 22px "Playfair Display",serif}
.qr{display:flex;justify-content:center;margin:15px auto}
.lang{font-size:12px;border:1px solid var(--line);background:white;padding:8px 10px;border-radius:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#29251f;color:white;padding:12px 18px;border-radius:8px;font-size:12px;z-index:50;box-shadow:0 8px 25px #0004}
.small{font-size:11px;color:var(--muted)}
.check-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.check-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:#fffdf9;font-size:13px;cursor:pointer}
.check-item input{width:16px;height:16px;accent-color:var(--gold)}
.footer{font-size:10px;color:#a39a8d;text-align:center;margin:30px 0 10px}
.photo-preview{width:100%;max-width:260px;max-height:220px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block;margin-top:10px}
.editor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.section-note{font-size:12px;color:var(--muted);line-height:1.6}
.invite-photo{width:min(100%,520px);max-height:360px;object-fit:cover;margin:20px auto 4px;border-radius:4px}
.invite-extra{margin:24px auto;max-width:540px;text-align:left;padding:18px;border-top:1px solid var(--line)}
.invite-extra h3{font:500 21px "Playfair Display",serif;margin:0 0 8px}
.invite-extra p{font-size:13px;line-height:1.8;color:#71685d;white-space:pre-line;margin:0 0 14px}
.invite-extra a{color:var(--gold);font-weight:700;text-decoration:none}
.music-player{margin:20px auto;max-width:420px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fbf8f2}
.music-player audio{width:100%;margin-top:6px}
.floor-plan{background:#f5efe4;border:1px solid var(--line);border-radius:12px;padding:22px;position:relative}
.floor-stage{text-align:center;padding:10px 18px;border:1px solid var(--gold2);background:#fffdf9;border-radius:30px;max-width:280px;margin:0 auto 24px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700}
.floor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.floor-table{background:#fffdf9;border:2px solid var(--gold2);border-radius:14px;padding:16px;text-align:center;box-shadow:0 8px 20px #4a38200a}
.floor-table.full-cap{border-color:var(--green)}
.floor-circle{width:76px;height:76px;border-radius:50%;border:1px dashed var(--gold);margin:0 auto 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fbf7ef}
.bar-bg{height:8px;background:#ece4d7;border-radius:99px;overflow:hidden;margin:8px 0}
.bar-fill{height:100%;background:var(--gold);border-radius:99px}
.guestbook-item{padding:14px;border:1px solid var(--line);border-radius:8px;background:#fffdf9;margin-bottom:10px;text-align:left}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px}
.sync-dot.online{background:var(--green)}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.filter-btn.active{background:var(--ink);color:white;border-color:var(--ink)}
.scanner-box{margin-top:16px;padding:16px;border:1px solid var(--gold2);border-radius:10px;background:#fbf8f2}
.scanner-video{width:100%;max-width:380px;border-radius:8px;background:#1c1915;display:block;margin:10px auto}

@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  .sidebar{display:flex;overflow:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);gap:4px}
  .side-label,.active-wedding-badge{display:none}
  .nav{white-space:nowrap;width:auto;padding:9px 11px}
  .nav .ico{width:auto}
  .main{padding:20px 15px}
  .cards{grid-template-columns:1fr 1fr}
  .wedding-grid,.editor-grid{grid-template-columns:1fr}
  .head-row{align-items:flex-start;flex-direction:column}
  .topbar{height:66px}
  .brand-name{font-size:19px}
}
@media(max-width:500px){
  .cards{grid-template-columns:1fr 1fr;gap:9px}
  .stat{padding:14px}
  .stat-num{font-size:25px}
  .form-grid,.check-grid{grid-template-columns:1fr}
  .full{grid-column:auto}
  .top-actions .btn{padding:8px 10px}
  .brand-sub{display:none}
  .invite-details{gap:16px}
}
</style>

function stopQrCamera() {
  if (qrScanTimer) {
    clearInterval(qrScanTimer);
    qrScanTimer = null;
  }
  if (qrStream) {
    qrStream.getTracks().forEach(tr => tr.stop());
    qrStream = null;
  }
  qrScannerOpen = false;
  qrScannerStatus = 'Caméra arrêtée';
}

function toggleQrScanner() {
  if (qrScannerOpen) {
    stopQrCamera();
    render('checkin');
    return;
  }
  qrScannerOpen = true;
  qrScannerStatus = 'Ouverture de la caméra…';
  render('checkin');
  startQrCameraLoop();
}

async function startQrCameraLoop() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    qrScannerStatus = 'Caméra indisponible : saisissez ou collez le code NUP- ci-dessous.';
    const st = $('#qr-scan-status');
    if (st) st.textContent = qrScannerStatus;
    return;
  }
  try {
    qrStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' } },
      audio: false
    });
    const videoEl = $('#qr-video');
    if (!videoEl || !qrScannerOpen) {
      stopQrCamera();
      return;
    }
    videoEl.srcObject = qrStream;
    await videoEl.play();

    const hasDetector = typeof window.BarcodeDetector === 'function';
    let detector = null;
    if (hasDetector) {
      try {
        detector = new window.BarcodeDetector({ formats: ['qr_code'] });
      } catch (e) {
        detector = null;
      }
    }

    if (!detector) {
      qrScannerStatus = 'Caméra active : pointez le QR code ou saisissez le code NUP- dans la recherche.';
      const st = $('#qr-scan-status');
      if (st) st.textContent = qrScannerStatus;
      return;
    }

    qrScannerStatus = 'Caméra active : présentez le QR code de l’invité…';
    const st = $('#qr-scan-status');
    if (st) st.textContent = qrScannerStatus;

    qrScanTimer = setInterval(async () => {
      if (!qrScannerOpen || !videoEl || videoEl.readyState < 2) return;
      try {
        const codes = await detector.detect(videoEl);
        if (codes && codes.length) {
          const rawValue = (codes[0].rawValue || '').trim();
          if (rawValue) {
            handleScannedQrValue(rawValue);
          }
        }
      } catch (e) {}
    }, 350);
  } catch (e) {
    stopQrCamera();
    qrScannerStatus = 'Accès caméra refusé ou indisponible : utilisez la recherche par code NUP-.';
    render('checkin');
  }
}

function handleScannedQrValue(rawVal) {
  const w = wedding();
  if (!w) return;
  const clean = rawVal.trim().toUpperCase();
  const matchToken = clean.match(/NUP-[A-Z0-9-]+/i)?.[0]?.toUpperCase() || clean;
  const guest = (w.guests || []).find(g => (g.token || '').toUpperCase() === matchToken);

  stopQrCamera();

  if (!guest) {
    showToast(`Code inconnu : ${matchToken}`);
    render('checkin');
    if ($('#check-search')) {
      $('#check-search').value = matchToken;
      drawCheckin(matchToken);
    }
    return;
  }

  guest.arrived = true;
  persist();
  render('checkin');
  if ($('#check-search')) {
    $('#check-search').value = guest.token;
    drawCheckin(guest.token);
  }
  showToast(`Entrée validée : ${guest.name} (${guest.token})`);
}

async function fetchWeddingExtrasFromSupabase(client, slug) {
  if (!client || !slug) return { tables: [], wishes: [], protocols: [] };
  const [tblRes, wishRes, protRes] = await Promise.all([
    client.from('wedding_tables').select('*').eq('wedding_slug', slug),
    client.from('wedding_wishes').select('*').eq('wedding_slug', slug).order('created_at', { ascending: true }),
    client.from('wedding_protocols').select('*').eq('wedding_slug', slug)
  ]);

  const tables = Array.isArray(tblRes.data)
    ? tblRes.data.map(r => ({
        id: r.id,
        name: r.name,
        capacity: Number(r.capacity) || 8
      }))
    : [];

  const wishes = Array.isArray(wishRes.data)
    ? wishRes.data.map(r => ({
        id: r.id,
        author: r.author,
        text: r.message,
        createdAt: r.created_at || new Date().toISOString()
      }))
    : [];

  const protocols = Array.isArray(protRes.data)
    ? protRes.data.map(r => ({
        id: r.id,
        name: r.name,
        phone: r.phone || '',
        zone: r.zone || 'accueil_qr',
        active: r.active !== false
      }))
    : [];

  return { tables, wishes, protocols };
}

async function pullAllWeddingsFromSupabase(silent = true) {
  const client = getDirectClient();
  if (!client) return false;
  try {
    const { data: wRows, error } = await client.from('weddings').select('*');
    if (error || !Array.isArray(wRows)) return false;

    supabaseOnline = true;
    updateTopSyncIndicator();

    for (const wData of wRows) {
      const slug = wData.slug || wData.id;
      if (!slug) continue;

      const [extras, gRes] = await Promise.all([
        fetchWeddingExtrasFromSupabase(client, slug),
        client.from('guests').select('*').eq('wedding_id', wData.id)
      ]);

      const remoteGuests = Array.isArray(gRes.data)
        ? gRes.data.map(rg => ({
            id: rg.id || rg.qr_token,
            name: rg.full_name,
            phone: rg.phone || '',
            seats: Number(rg.seats) || 1,
            tableId: rg.table_id || '',
            status: rg.rsvp_status || 'pending',
            token: rg.qr_token,
            arrived: Boolean(rg.arrived)
          }))
        : [];

      let localW = db.weddings.find(x => x.id === slug || x.id === wData.id);
      if (!localW) {
        if (!isOwnerRole() && db.selected && db.selected !== slug) continue;
        localW = {
          id: slug,
          couple: wData.couple_names || 'Mariage',
          date: wData.wedding_date || '',
          venue: wData.venue || '',
          reception: wData.reception || wData.venue || '',
          ceremony: wData.ceremony || '',
          message: wData.message || '',
          story: wData.story || '',
          photo: '',
          mapUrl: wData.map_url || '',
          gpsLat: wData.gps_lat || '',
          gpsLng: wData.gps_lng || '',
          musicUrl: wData.music_url || '',
          musicData: '',
          musicName: '',
          dressCodes: [],
          dressCode: wData.dress_code || '',
          program: wData.program || '',
          websiteNote: wData.website_note || '',
          protocols: extras.protocols,
          tables: extras.tables,
          guests: remoteGuests,
          wishes: extras.wishes
        };
        db.weddings.push(localW);
      } else {
        if (wData.couple_names) localW.couple = wData.couple_names;
        if (wData.wedding_date !== null) localW.date = wData.wedding_date || '';
        if (wData.venue !== null) localW.venue = wData.venue || '';
        if (wData.ceremony !== null) localW.ceremony = wData.ceremony || '';
        if (wData.reception !== null) localW.reception = wData.reception || '';
        if (wData.message !== null) localW.message = wData.message || localW.message;
        if (wData.story !== null) localW.story = wData.story || '';
        if (wData.map_url !== null) localW.mapUrl = wData.map_url || '';
        if (wData.gps_lat !== null) localW.gpsLat = wData.gps_lat || '';
        if (wData.gps_lng !== null) localW.gpsLng = wData.gps_lng || '';
        if (wData.music_url !== null) localW.musicUrl = wData.music_url || '';
        if (wData.program !== null) localW.program = wData.program || '';
        if (wData.website_note !== null) localW.websiteNote = wData.website_note || '';

        if (extras.tables.length) localW.tables = extras.tables;
        if (extras.protocols.length) localW.protocols = extras.protocols;

        if (extras.wishes.length) {
          const wishMap = new Map((localW.wishes || []).map(x => [x.id, x]));
          extras.wishes.forEach(rw => wishMap.set(rw.id, rw));
          localW.wishes = Array.from(wishMap.values());
        }

        if (remoteGuests.length) {
          const guestMap = new Map((localW.guests || []).map(x => [x.token, x]));
          remoteGuests.forEach(rg => {
            const existing = guestMap.get(rg.token);
            if (existing) {
              existing.name = rg.name || existing.name;
              existing.phone = rg.phone || existing.phone;
              existing.seats = rg.seats || existing.seats;
              existing.tableId = rg.tableId !== undefined ? rg.tableId : existing.tableId;
              existing.status = rg.status || existing.status;
              existing.arrived = Boolean(rg.arrived);
            } else {
              guestMap.set(rg.token, rg);
            }
          });
          localW.guests = Array.from(guestMap.values());
        }
      }
    }

    persist(true);
    if (!silent) showToast('Données actualisées depuis Supabase');
    return true;
  } catch (e) {
    return false;
  }
}

function scheduleRealtimeRefresh() {

function startRealtimeSync() {
  const client = getDirectClient();
  if (!client) return;
  try {
    if (realtimeChannel) {
      client.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }
    realtimeChannel = client
      .channel('nuptia-live-sync')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'weddings' }, scheduleRealtimeRefresh)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'guests' }, scheduleRealtimeRefresh)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'wedding_tables' }, scheduleRealtimeRefresh)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'wedding_wishes' }, scheduleRealtimeRefresh)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'wedding_protocols' }, scheduleRealtimeRefresh)
      .subscribe(status => {
        realtimeActive = (status === 'SUBSCRIBED');
        updateTopSyncIndicator();
      });
  } catch (e) {
    realtimeActive = false;
    updateTopSyncIndicator();
  }
}

async function syncDirectTablesToSupabase(targetWeddingId, targetToken) {
  const client = getDirectClient();
  if (!client) {
    supabaseOnline = false;
    updateTopSyncIndicator();
    return false;
  }
  const reachable = await verifySupabaseConnection();
  if (!reachable) return false;

  try {
    const list = targetWeddingId
      ? (db.weddings || []).filter(w => w.id === targetWeddingId)
      : (db.weddings || []);

    for (const w of list) {
      const slug = w.id;
      const { data: wRow, error: wErr } = await client
        .from('weddings')
        .upsert({
          slug: slug,
          couple_names: w.couple,
          wedding_date: w.date || null,
          venue: w.venue || null,
          ceremony: w.ceremony || null,
          reception: w.reception || null,
          message: w.message || null,
          story: w.story || null,
          map_url: w.mapUrl || null,
          gps_lat: w.gpsLat || null,
          gps_lng: w.gpsLng || null,
          music_url: w.musicUrl || null,
          dress_code: formatDressCode(w) || null,
          program: w.program || null,
          website_note: w.websiteNote || null
        }, { onConflict: 'slug' })
        .select('id')
        .maybeSingle();

      if (wErr) {
        lastSupabaseError = wErr.message;
        continue;
      }

      const localTables = w.tables || [];
      for (const tb of localTables) {
        await client.from('wedding_tables').upsert({
          id: tb.id,
          wedding_slug: slug,
          name: tb.name,
          capacity: Number(tb.capacity) || 8
        }, { onConflict: 'id' });
      }
      const { data: remoteTables } = await client
        .from('wedding_tables')
        .select('id')
        .eq('wedding_slug', slug);
      if (Array.isArray(remoteTables)) {
        const localTableIds = new Set(localTables.map(tb => tb.id));
        for (const rt of remoteTables) {
          if (!localTableIds.has(rt.id)) {
            await client.from('wedding_tables').delete().eq('id', rt.id);
          }
        }
      }

      const localWishes = w.wishes || [];
      for (const wish of localWishes) {
        await client.from('wedding_wishes').upsert({
          id: wish.id,
          wedding_slug: slug,
          author: wish.author,
          message: wish.text,
          created_at: wish.createdAt || new Date().toISOString()
        }, { onConflict: 'id' });
      }
      const { data: remoteWishes } = await client
        .from('wedding_wishes')
        .select('id')
        .eq('wedding_slug', slug);
      if (Array.isArray(remoteWishes)) {
        const localWishIds = new Set(localWishes.map(x => x.id));
        for (const rw of remoteWishes) {
          if (!localWishIds.has(rw.id)) {
            await client.from('wedding_wishes').delete().eq('id', rw.id);
          }
        }
      }

      const localProtocols = w.protocols || [];
      for (const pr of localProtocols) {
        await client.from('wedding_protocols').upsert({
          id: pr.id,
          wedding_slug: slug,
          name: pr.name,
          phone: pr.phone || '',
          zone: pr.zone || 'accueil_qr',
          active: pr.active !== false
        }, { onConflict: 'id' });
      }
      const { data: remoteProtocols } = await client
        .from('wedding_protocols')
        .select('id')
        .eq('wedding_slug', slug);
      if (Array.isArray(remoteProtocols)) {
        const localProtIds = new Set(localProtocols.map(x => x.id));
        for (const rp of remoteProtocols) {
          if (!localProtIds.has(rp.id)) {
            await client.from('wedding_protocols').delete().eq('id', rp.id);
          }
        }
      }

      const dbWeddingId = wRow?.id;
      if (!dbWeddingId) continue;

      const guestsToSync = targetToken
        ? (w.guests || []).filter(g => g.token === targetToken)
        : (w.guests || []);

      for (const g of guestsToSync) {
        await client
          .from('guests')
          .upsert({
            wedding_id: dbWeddingId,
            full_name: g.name,
            phone: g.phone || '',
            seats: g.seats || 1,
            table_id: g.tableId || '',
            qr_token: g.token,
            rsvp_status: g.status || 'pending',
            arrived: Boolean(g.arrived)
          }, { onConflict: 'qr_token' });
      }
    }
  } catch (e) {
    lastSupabaseError = e.message || '';
  }
  return true;
}

async function sendWeddingToProtocol(wid) {
  if (!canEditSettings()) return showToast('Action non autorisée pour ce rôle');
  const w = db.weddings.find(x => x.id === wid) || wedding();
  if (!w) return showToast('Aucun mariage sélectionné');
  db.selected = w.id;
  persist(false);
  await syncDirectTablesToSupabase(w.id);
  const url = location.origin + location.pathname + '?wedding=' + encodeURIComponent(w.id) + '&role=protocol';
  shareMeta = { label: `Accès Protocole (${w.couple})`, code: '' };
  openModal('Envoyer au Protocole', `
    <p style="line-height:1.65;margin-top:0">
      Les invités, places, tables et codes de <strong>${esc(w.couple)}</strong> sont prêts pour l’équipe Protocole (${(w.protocols || []).length} membre(s) enregistré(s)).
    </p>
    <div class="field"><label>Lien d’accès Protocole (jour J)</label><input id="share-url" value="${esc(url)}" readonly></div>
    <div class="notice">Quand l’équipe protocole ouvre ce lien sur son téléphone, elle accède uniquement à l’accueil terrain et au placement.</div>
    <div class="actions" style="margin-top:14px">
      <button class="btn" onclick="copyShare()">⧉ ${t('copy')}</button>
      <button class="btn gold" onclick="whatsShareProtocol()">◉ Envoyer au Protocole (WhatsApp)</button>
      <button class="btn" onclick="pullProtocolUpdates('${w.id}')">↻ Actualiser retours terrain</button>
    </div>
  `, 'closeModal()', 'Fermer');
}

function whatsShareProtocol() {
  const v = $('#share-url').value;
  window.open('https://wa.me/?text=' + encodeURIComponent('Accès Protocole NUPTIA (accueil & placement) : ' + v), '_blank');
}

async function pullProtocolUpdates(wid) {
  const ok = await pullAllWeddingsFromSupabase(false);
  if (ok) {
    render(location.hash.slice(1) || getDefaultPageForRole());
  } else {
    showToast('Impossible de récupérer les données cloud');
  }
}

async function applyRoleUrlContext() {
  const params = new URLSearchParams(location.search);
  const wid = params.get('wedding');
  const roleParam = params.get('role');
  if (roleParam === 'protocol' || roleParam === 'admin') {
    cloudCfg.role = roleParam;
    cloudCfg.ownerUnlocked = false;
    saveCloudCfg();
    if (wid) {
      db.selected = wid;
      await pullAllWeddingsFromSupabase(true);
      const nextHash = roleParam === 'admin' ? '#guests' : '#checkin';
      history.replaceState({}, '', location.pathname + nextHash);
    }
  }
}

const t = k => (translations[db.lang] && translations[db.lang][k]) || translations.fr[k] || k;

function persist(skipCloud) {
  try {
    localStorage.setItem(storeKey, JSON.stringify(db));
  } catch (e) {
    showToast('Stockage navigateur saturé : réduisez la taille du fichier média.');
  }
  if (!skipCloud) {
    syncDirectTablesToSupabase();
  }
}

function esc(s = '') {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function wedding() {
  if (!db.weddings.length) return null;
  return db.weddings.find(w => w.id === db.selected) || db.weddings[0];
}

function allGuests() {
  return db.weddings.reduce((a, w) => a.concat(w.guests || []), []);
}

function showToast(msg) {
  $('#toast-root').innerHTML = `<div class="toast">${esc(msg)}</div>`;
  setTimeout(() => { $('#toast-root').innerHTML = ''; }, 2600);
}

function go(page) {
  if (page !== 'checkin' && qrScannerOpen) {
    stopQrCamera();
  }
  const safePage = canAccessPage(page) ? page : getDefaultPageForRole();
  history.pushState({ page: safePage }, '', `#${safePage}`);
  render(safePage);
}

function buildMapLink(w) {
  if (w.gpsLat && w.gpsLng) {
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(w.gpsLat + ',' + w.gpsLng)}`;
  }
  if (w.mapUrl) return w.mapUrl;
  const query = w.reception || w.ceremony || w.venue;
  return query ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}` : '';
}

function formatDressCode(w) {
  const dict = DRESS_OPTIONS[db.lang] || DRESS_OPTIONS.fr;
  const labels = (w.dressCodes || []).map(id => dict.find(o => o.id === id)?.label).filter(Boolean);
  if (w.dressCode) labels.push(w.dressCode);
  return labels.join(' • ');
}

function roleLabelShort() {
  const r = getRole();
  if (r === 'protocol') return 'Protocole';
  if (r === 'admin') return 'Administrateur';
  return 'Gestionnaire';
}

function header() {
  const badge = roleLabelShort();
  const statusLabel = supabaseOnline ? (realtimeActive ? 'Supabase Live' : 'Supabase OK') : 'Local';
  return `<header class="topbar">

      ${canSeeSync() ? `<button id="top-sync-btn" class="btn sm ${supabaseOnline ? 'online-pill' : ''}" onclick="go('sync')" title="Synchronisation">

      </button>` : `<span class="pill">${badge}</span>`}

      <div class="actions">
        ${w ? `<button class="btn sm" onclick="pullProtocolUpdates('${w.id}')">↻ Actualiser la liste</button>` : ''}

  }

    return `<div class="panel" style="margin-top:24px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">

      <strong style="font-size:13px;display:block;margin:4px 0 10px">${supabaseOnline ? (realtimeActive ? 'Connecté à Supabase (Temps réel actif)' : 'Connecté à Supabase') : 'Mode hors-ligne / Local'}</strong>
      <div class="actions">
        <button class="btn sm" onclick="go('sync')">Ouvrir Synchronisation</button>
      </div>
    </div>
  </div>`;
}

    ['overview', '⌂'],
    ['weddings', '♡'],

    ['guests', '♧'],
    ['seating', '▦'],
    ['protocols', '◈'],
    ['checkin', '✓'],

}

function openProtocolModal() {
  if (!canManageProtocols()) return showToast('Action non autorisée');
  const zones = PROTOCOL_ZONES[db.lang] || PROTOCOL_ZONES.fr;
  openModal('Ajouter un protocole', `
    <div class="form-grid">
      <div class="field full"><label>Nom du protocole ou de l’équipe</label><input id="f-pname" placeholder="Ex. Sarah — Accueil Entrée"></div>
      <div class="field full">
        <label>Catégorie / Mission</label>
        <select id="f-pzone">
          ${zones.map(z => `<option value="${z.id}">${esc(z.label)}</option>`).join('')}
        </select>
      </div>
      <div class="field full"><label>Téléphone (facultatif)</label><input id="f-pphone" placeholder="+243…"></div>
    </div>
  `, 'saveProtocol()');
}

function saveProtocol() {
  if (!canManageProtocols()) return;
  const name = ($('#f-pname')?.value || '').trim();
  if (!name) {
    showToast('Indiquez le nom du protocole');
    return;
  }
  const w = wedding();
  w.protocols = w.protocols || [];
  const item = {
    id: 'p-' + Date.now(),
    name,
    zone: $('#f-pzone')?.value || 'accueil_qr',
    phone: ($('#f-pphone')?.value || '').trim(),
    active: true
  };
  w.protocols.push(item);
  if (!cloudCfg.activeProtocolId) {
    cloudCfg.activeProtocolId = item.id;
    saveCloudCfg();
  }
  persist();
  closeModal();
  showToast('Protocole enregistré');
  render('protocols');
}

function updateProtocolZone(pid, zone) {
  if (!canManageProtocols()) return;
  const w = wedding();
  const item = (w.protocols || []).find(p => p.id === pid);
  if (item) {
    item.zone = zone;
    persist();
    showToast('Catégorie mise à jour');
    render('protocols');
  }
}

function toggleProtocolActive(pid) {
  if (!canManageProtocols()) return;
  const w = wedding();
  const item = (w.protocols || []).find(p => p.id === pid);
  if (item) {
    item.active = item.active === false ? true : false;
    persist();
    render('protocols');
  }
}

function setActiveTerrainProtocol(pid) {
  cloudCfg.activeProtocolId = pid;
  saveCloudCfg();
  showToast('Protocole affecté au terrain');
  render('protocols');
}

function removeProtocol(pid) {
  if (!canManageProtocols()) return;
  const w = wedding();
  w.protocols = (w.protocols || []).filter(p => p.id !== pid);
  if (cloudCfg.activeProtocolId === pid) {
    cloudCfg.activeProtocolId = w.protocols[0]?.id || '';
    saveCloudCfg();
  }
  persist();
  render('protocols');
}

function render(page) {
  try {
    const params = new URLSearchParams(location.search);
    const roleParam = params.get('role');
    if (params.has('wedding') && roleParam !== 'protocol' && roleParam !== 'admin') {
      renderInvite(params.get('wedding'), params.get('invite'));
      return;
    }
    const targetPage = canAccessPage(page) ? page : getDefaultPageForRole();
    if (targetPage === 'overview') return dashboard();
    if (targetPage === 'weddings') return weddingsPage();
    if (targetPage === 'settings') return settingsPage();
    if (targetPage === 'guests') return guestsPage();
    if (targetPage === 'seating') return seatingPage();
    if (targetPage === 'protocols') return protocolsPage();
    if (targetPage === 'checkin') return checkinPage();
    if (targetPage === 'stats') return statsPage();
    if (targetPage === 'guestbook') return guestbookPage();
    if (targetPage === 'sync') return syncPage();
  } catch (e) {
    render(getDefaultPageForRole());
  }
}

  if (!canManageWeddings()) return;

let pendingWeddingPhoto = '';
let pendingMusicData = '';
let pendingMusicName = '';

function capturePhoneGps() {
  if (!navigator.geolocation) {
    showToast('Géolocalisation non disponible sur ce navigateur');
    return;
  }
  showToast('Recherche de votre position GPS…');
  navigator.geolocation.getCurrentPosition(
    pos => {
      $('#ed-lat').value = pos.coords.latitude.toFixed(6);
      $('#ed-lng').value = pos.coords.longitude.toFixed(6);
      showToast('Coordonnées GPS capturées !');
    },
    () => showToast('Impossible de récupérer le GPS (autorisez la localisation)')
  );
}

function previewWeddingPhoto(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    showToast('Choisissez un fichier image');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const max = 1000;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      pendingWeddingPhoto = canvas.toDataURL('image/jpeg', 0.76);
      const preview = $('#photo-preview');
      preview.src = pendingWeddingPhoto;
      preview.classList.remove('hidden');
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function removeWeddingPhoto() {
  pendingWeddingPhoto = '';
  wedding().photo = '';
  persist();
  render('settings');
}

function handleMusicFile(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 4.5 * 1024 * 1024 && !supabaseClient) {
    showToast('Audio > 4,5 Mo : utilisez un fichier plus léger ou connectez Supabase.');
    input.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    pendingMusicData = reader.result;
    pendingMusicName = file.name;
    $('#music-status').innerHTML = `Prêt à enregistrer : <strong>${esc(file.name)}</strong>`;
  };
  reader.readAsDataURL(file);
}

function removeWeddingMusic() {
  pendingMusicData = '';
  pendingMusicName = '';
  const w = wedding();
  w.musicData = '';
  w.musicName = '';
  w.musicUrl = '';
  persist();
  render('settings');
}

function saveWeddingDetails() {
  if (!canEditSettings()) return showToast('Action non autorisée');
  const w = wedding();
  w.couple = $('#ed-couple').value.trim() || w.couple;
  w.date = $('#ed-date').value;
  w.story = $('#ed-story').value.trim();
  w.message = $('#ed-message').value.trim();
  w.ceremony = $('#ed-ceremony').value.trim();
  w.reception = $('#ed-reception').value.trim();
  w.venue = w.reception || w.ceremony || w.venue;
  w.gpsLat = $('#ed-lat').value.trim();
  w.gpsLng = $('#ed-lng').value.trim();
  w.mapUrl = $('#ed-map').value.trim();
  w.musicUrl = $('#ed-music').value.trim();
  w.dressCodes = Array.from(document.querySelectorAll('input[name="dc-opt"]:checked')).map(el => el.value);
  w.dressCode = $('#ed-dress').value.trim();
  w.websiteNote = $('#ed-note').value.trim();
  w.program = $('#ed-program').value.trim();

  if (pendingWeddingPhoto) w.photo = pendingWeddingPhoto;
  if (pendingMusicData) {
    w.musicData = pendingMusicData;
    w.musicName = pendingMusicName;
  }
  pendingWeddingPhoto = '';
  pendingMusicData = '';
  pendingMusicName = '';

  persist();
  showToast('Modifications enregistrées et synchronisées');
  render('settings');
}

function filterGuests(q) {
  document.querySelectorAll('#guest-table tbody tr').forEach(r => {
    r.style.display = r.dataset.name.includes(q.toLowerCase()) ? '' : 'none';

}

function assignTable(gid, tid) {
  const w = wedding();
  const g = w.guests.find(x => x.id === gid);
  const tb = w.tables.find(x => x.id === tid);
  if (tb) {
    const used = w.guests.filter(x => x.tableId === tid && x.id !== gid).reduce((a, x) => a + x.seats, 0);
    if (used + g.seats > tb.capacity) {
      showToast('Capacité de la table dépassée');
      render('guests');
      return;
    }
  }
  g.tableId = tid;
  persist();
  render('guests');
}

function setCheckinFilter(mode) {
  checkinFilter = mode;
  const q = $('#check-search') ? $('#check-search').value : '';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  render('checkin');
  if (q && $('#check-search')) {
    $('#check-search').value = q;
    drawCheckin(q);
  }
}

function checkRows(w, q) {
  const query = (q || '').trim().toLowerCase();
  const a = w.guests.filter(g => {
    const matchText = !query || g.name.toLowerCase().includes(query) || g.token.toLowerCase().includes(query);
    if (!matchText) return false;
    if (checkinFilter === 'arrived') return Boolean(g.arrived);
    if (checkinFilter === 'pending') return !g.arrived;
    return true;
  });
  return a.length ? a.map(g => {
    const tblName = w.tables.find(tb => tb.id === g.tableId)?.name || t('notAssigned');
    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap">
      <div>
        <strong>${esc(g.name)}</strong> ${g.arrived ? `<span class="pill ok">${t('arrived')}</span>` : ''}
        <div class="small">${esc(g.token)} · ${g.seats} place(s) · <strong>${esc(tblName)}</strong></div>
      </div>
      <div class="actions">
        ${g.arrived
          ? `<button class="btn sm" onclick="toggleCheckIn('${g.id}', false)">${t('unmark')}</button>`
          : `<button class="btn gold" onclick="toggleCheckIn('${g.id}', true)">${t('mark')}</button>`}
      </div>
    </div>`;
  }).join('') : `<div class="empty">${t('noGuests')}</div>`;
}

function drawCheckin(q) {
  $('#check-results').innerHTML = checkRows(wedding(), q);
}

function toggleCheckIn(id, state) {
  const g = wedding().guests.find(x => x.id === id);
  if (g) {
    g.arrived = Boolean(state);
    persist();
    render('checkin');
    showToast(g.arrived ? t('arrived') : 'Entrée annulée');
  }
}

function statsPage() {
  if (!canSeeStatsAndGuestbook()) return go(getDefaultPageForRole());
  const w = wedding();
  if (!w) return go(getDefaultPageForRole());
  const gs = w.guests || [];

  const confirmed = gs.filter(g => g.status === 'confirmed');

  const declined = gs.filter(g => g.status === 'declined');
  const arrived = gs.filter(g => g.arrived);

  const totalSeats = gs.reduce((a, g) => a + g.seats, 0);
  const confirmedSeats = confirmed.reduce((a, g) => a + g.seats, 0);
  const totalCap = (w.tables || []).reduce((a, tb) => a + tb.capacity, 0);
  const assignedSeats = gs.filter(g => g.tableId).reduce((a, g) => a + g.seats, 0);
  const rate = totalInvites ? Math.round((confirmed.length / totalInvites) * 100) : 0;

  shell('stats', `

      <div class="stat"><div class="stat-label">Places attribuées (Tables)</div><div class="stat-num">${assignedSeats}</div><div class="stat-sub">capacité salle : ${totalCap}</div></div>
      <div class="stat"><div class="stat-label">Présents accueillis</div><div class="stat-num">${arrived.length}</div><div class="stat-sub">${arrived.reduce((a, g) => a + g.seats, 0)} personnes entrées</div></div>

    <section class="panel">

        <div class="small">Confirmés (${confirmed.length})</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${totalInvites ? (confirmed.length / totalInvites) * 100 : 0}%;background:var(--green)"></div></div>
        <div class="small">En attente (${pending.length})</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${totalInvites ? (pending.length / totalInvites) * 100 : 0}%;background:var(--gold)"></div></div>
        <div class="small">Déclinés (${declined.length})</div>

      </div>
    </section>
  `);

function downloadBackup() {
  if (!canSeeSync()) return showToast('Action réservée au gestionnaire');
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `NUPTIA-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  showToast('Sauvegarde téléchargée');
}

function restoreBackup(input) {
  if (!canSeeSync()) return showToast('Action réservée au gestionnaire');
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!Array.isArray(parsed.weddings)) throw new Error('Format invalide');
      db = { ...db, ...parsed };
      persist();
      showToast('Sauvegarde restaurée avec succès');
      render(getDefaultPageForRole());
    } catch (e) {
      showToast('Fichier de sauvegarde invalide');
    }
  };
  reader.readAsText(file);
}

function renderCountdown(dateStr) {
  if (!dateStr) return '';
  const target = new Date(dateStr + 'T12:00:00').getTime();
  const diff = target - Date.now();
  if (isNaN(target) || diff <= 0) return '';
  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const mins = Math.floor((diff % 3600000) / 60000);
  return `<div style="margin:18px auto;padding:12px 18px;border:1px solid var(--gold2);border-radius:8px;max-width:340px;background:#fbf8f2">
    <div class="small" style="text-transform:uppercase;letter-spacing:1.5px;color:var(--gold)">${t('countdownLabel')}</div>
    <div style="font:500 22px 'Playfair Display',serif;margin-top:4px">${days} ${t('days')} · ${hours} ${t('hours')} · ${mins} ${t('mins')}</div>
  </div>`;
}

async function fetchSupabaseInvite(wid, token) {
  const pubClient = getDirectClient();
  if (!pubClient) return null;
  try {
    const { data: wData } = await pubClient
      .from('weddings')
      .select('*')
      .or(`id.eq.${wid},slug.eq.${wid}`)
      .maybeSingle();
    if (!wData) return null;

    const slug = wData.slug || wData.id;
    const extras = await fetchWeddingExtrasFromSupabase(pubClient, slug);

    let guest = null;
    if (token) {
      const { data: gData } = await pubClient
        .from('guests')
        .select('*')
        .eq('wedding_id', wData.id)
        .eq('qr_token', token)
        .maybeSingle();
      if (gData) {
        guest = {
          id: gData.id,
          name: gData.full_name,
          phone: gData.phone || '',
          seats: gData.seats || 1,
          tableId: gData.table_id || '',
          status: gData.rsvp_status || 'pending',
          token: gData.qr_token,
          arrived: Boolean(gData.arrived)
        };
      }
    }

    return {
      wedding: {
        id: slug,
        couple: wData.couple_names || wData.couple || 'Mariage',
        date: wData.wedding_date || wData.date || '',
        venue: wData.venue || '',
        reception: wData.reception || wData.venue || '',
        ceremony: wData.ceremony || '',
        message: wData.message || '',
        story: wData.story || '',
        photo: wData.photo || '',
        mapUrl: wData.map_url || '',
        gpsLat: wData.gps_lat || '',
        gpsLng: wData.gps_lng || '',
        musicUrl: wData.music_url || '',
        musicData: '',
        musicName: '',
        dressCodes: [],
        dressCode: wData.dress_code || '',
        program: wData.program || '',
        websiteNote: wData.website_note || '',
        protocols: extras.protocols,
        tables: extras.tables,
        guests: guest ? [guest] : [],
        wishes: extras.wishes
      },
      guest
    };
  } catch (e) {
    return null;
  }
}

        w = cloudHit.wedding;
      } else {
        w.couple = cloudHit.wedding.couple || w.couple;

        w.venue = cloudHit.wedding.venue || w.venue;

async function guestRsvp(wid, token, status) {
  const w = db.weddings.find(x => x.id === wid);
  const g = w?.guests.find(x => x.token === token);
  if (!g) return;
  g.status = status;
  persist(true);
  const pubClient = getDirectClient();
  if (pubClient) {
    try {
      await pubClient.from('guests').update({ rsvp_status: status }).eq('qr_token', token);
    } catch (e) {}
  }
  showToast(status === 'confirmed' ? t('rsvpDone') : t('rsvpDeclinedDone'));
  renderInvite(wid, token);
}

async function submitWish(wid, token) {
  const w = db.weddings.find(x => x.id === wid);
  if (!w) return;
  const author = $('#wish-author').value.trim();
  const text = $('#wish-text').value.trim();
  if (!author || !text) {
    showToast('Indiquez votre nom et votre message');
    return;
  }
  const wishItem = { id: 'wish-' + Date.now(), author, text, createdAt: new Date().toISOString() };
  w.wishes = w.wishes || [];
  w.wishes.push(wishItem);
  persist(true);
  const pubClient = getDirectClient();
  if (pubClient) {
    try {
      await pubClient.from('wedding_wishes').upsert({
        id: wishItem.id,
        wedding_slug: w.id,
        author: wishItem.author,
        message: wishItem.text,
        created_at: wishItem.createdAt
      }, { onConflict: 'id' });
    } catch (e) {}
  }
  showToast(t('wishSent'));
  renderInvite(wid, token);
}

function setLang(v) {
  db.lang = v;
  persist(true);
  if (location.search) {
    const p = new URLSearchParams(location.search);
    renderInvite(p.get('wedding'), p.get('invite'));
  } else {
    const page = location.hash.slice(1) || getDefaultPageForRole();
    render(canAccessPage(page) ? page : getDefaultPageForRole());
  }
}

window.addEventListener('popstate', () => {
  if (qrScannerOpen) stopQrCamera();
  const page = location.hash.slice(1) || getDefaultPageForRole();
  render(canAccessPage(page) ? page : getDefaultPageForRole());
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    scheduleRealtimeRefresh();
  } else if (qrScannerOpen) {
    stopQrCamera();
  }
});

(async function boot() {
  if (new URLSearchParams(location.search).get('force_owner') === '1') {
    cloudCfg.role = 'owner';
    cloudCfg.ownerUnlocked = true;
    saveCloudCfg();
    history.replaceState({}, '', location.pathname + '#overview');
  }
  await applyRoleUrlContext();
  const ok = await verifySupabaseConnection();
  if (ok) {
    await pullAllWeddingsFromSupabase(true);
    await syncDirectTablesToSupabase();
    startRealtimeSync();
  }
  const initialPage = location.hash.slice(1) || getDefaultPageForRole();
  render(canAccessPage(initialPage) ? initialPage : getDefaultPageForRole());
})();
</script>
</body>
</html>
